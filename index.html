<!--
═══════════════════════════════════════════════════════════════════════════
 ANALISIS FILE SEBELUMNYA (index.html versi lama)
───────────────────────────────────────────────────────────────────────────
 [F1] Halaman memakai tombol "START HACKING" + label "simulasi ethical
      hacking" + "DOWNLOAD KONTEN"  → immersion rusak, jelas terlihat palsu.
 [F2] Tidak ada terminal sungguhan: tidak ada stdin, tidak ada prompt,
      tidak ada penanganan keyboard, tidak ada history/Ctrl+C/Tab.
 [F3] Tidak mengikuti standar visual Kali Linux (login tty, zsh prompt
      ┌──(user㉿host)-[~], warna output, MOTD, boot sequence).
 [F4] Tidak ada command handling / error handling (command not found,
      permission denied, exit status, prompt merah saat error).
 [F5] Tidak ada skenario kerja yang koheren (recon → foothold → privesc),
      sehingga terlihat seperti animasi acak, bukan sesi kerja nyata.
 [F6] Font fallback monospace seadanya, tidak responsive, fokus keyboard
      tidak dikelola.

 PERBAIKAN YANG DITERAPKAN
───────────────────────────────────────────────────────────────────────────
 [P1] Semua penanda "simulasi/tombol" dihapus total.
 [P2] Rebuild penuh: boot systemd → login tty1 (user: kali) → MOTD →
      shell zsh interaktif dengan prompt Kali asli.
 [P3] ±60 command nyata: coreutils, network, dan tool Kali (nmap, hydra,
      sqlmap, gobuster, nikto, john, hashcat, msfconsole, msfvenom,
      searchsploit, wifite, neofetch, vim, python3, ssh, sudo, ...).
 [P4] Error handling realistis: "zsh: command not found", "Permission
      denied", prompt └─$ merah saat exit status gagal, Ctrl+C, Ctrl+L,
      Tab completion, history (↑/↓).
 [P5] Senario pentest resmi (SOW fiktif) di 192.168.1.20: recon →
      kredensial bocor → SSH foothold → privesc sudo vim → root.
      Sub-shell msfconsole & ssh remote juga berfungsi.
 [P6] JetBrains Mono via fontsource, capture input tersembunyi (desktop
      + mobile), auto-scroll, snapshot layar untuk vim/man (alt-screen).

 VERIFIKASI (review statis alur)
───────────────────────────────────────────────────────────────────────────
 [V1] boot → login (hanya "kali" diterima, selain itu "Login incorrect").
 [V2] Shell: help/ls/cat/cd/sudo/exit dll menghasilkan output sesuai alur.
 [V3] ssh admin@192.168.1.20 hanya sukses dengan password dari .env/hydra.
 [V4] Ctrl+C menginterupsi proses panjang (nmap/hydra/breach.sh).
 [V5] Tidak ada referensi resource eksternal selain fontsource CDN.
═══════════════════════════════════════════════════════════════════════════
-->

async function emit(items,base){

function promptHTML(){
  if(S.mode==='remote'||S.mode==='remoteroot'){

function hideBar(){BAR.style.display='none';}

function renderBar(){

      (CAPT.masked?'':'<span>'+esc(CAPT.buf)+'</span>')+'<span class="cur"></span>';
  }else{
    BAR.innerHTML=promptHTML()+'<span>'+esc(buf)+'</span><span class="cur"></span>';

}
function freezeTyped(line,extra){
  P(promptHTML()+esc(line)+(extra?'<span class="rd">'+extra+'</span>':''));

/* ══════════════ busy wrapper & readLine ══════════════ */
async function busy(ret,fn){
  const prev=S.mode;S.mode='busy';hideBar();S.aborted=false;
  try{await fn();}finally{
    S.mode=S.nextMode||ret;S.nextMode=null;S.aborted=false;
    if(S.mode!=='off'&&S.mode!=='vim'&&S.mode!=='pager')showBar();
  }
}
function readLine(prompt,masked){
  return new Promise(res=>{
    CAPT={prompt,masked:!!masked,buf:'',res};renderBar();CAP.focus();
  });
}
function finishCapt(v){
  const p=CAPT.prompt,m=CAPT.masked,r=CAPT.res;CAPT=null;
  P('<span class="wh">'+esc(p)+'</span>'+(m?'':esc(v)));
  r(v);
}

CMDS.sudo=async(a)=>{
  if(!await askSudo())return;
  const rest=a.trim();

  if(rest==='-i'||rest==='su'||rest==='su -'||rest==='-s'){S.root=true;return;}
  if(rest==='cat /etc/shadow'){await CMDS.cat('/etc/shadow',null,true);return;}

  // jalankan sub-command sebagai root

  if(CMDS[n2]){await CMDS[n2](r2.join(' '),rest,true);}
  else{T('sudo: '+n2+': command not found','rd');S.lastErr=true;}
};

    ['===============','','   Id  Name  Type   Information                 Connection','   --  ----  ----   -----------                 ----------','   1         shell  ssh admin @ web-prod-01     192.168.1.17:52144 -> '+TARGET+':22 (192.168.1.20)'],10);return;
  }
  if(name==='help'){await emit(['Core commands: banner  search  use  back  show options  set  run  sessions  exit',''],8);return;}
  T('[-] Unknown command: '+name,'rd');S.lastErr=true;
}

/* ══════════════ python REPL sederhana ══════════════ */
async function runPy(line){
  line=line.trim();
  if(line==='exit()'||line==='quit()'){S.mode=S.remote?'remote':'shell';return;}
  if(line===''){return;}
  const pm=line.match(/^print\(\s*["'](.*)["']\s*\)$/);
  if(pm){T(pm[1]);return;}
  const pn=line.match(/^print\(\s*(-?\d+(?:\.\d+)?)\s*\)$/);
  if(pn){T(pn[1]);return;}
  if(/^[-+*/().\d\s]+$/.test(line)){
    try{const v=Function('"use strict";return('+line+')')();T(String(v));return;}catch(e){}
  }
  T("Traceback (most recent call last):",'wh');
  T('  File "<stdin>", line 1, in <module>','wh');
  T("NameError: name '"+line.split(/[ (]/)[0]+"' is not defined",'rd');
}

/* ══════════════ vim & pager (alt-screen) ══════════════ */
function openVim(file,remote){
  S.vimBackup=TERM.innerHTML;
  S.vimFile=file;S.vimColon=false;S.vimCmd='';S.mode='vim';
  hideBar();TERM.innerHTML='';
  const src=remote&&REMOTE_FILES[file]?REMOTE_FILES[file]:(FILES[file]!==undefined?FILES[file]:'');
  const lines=src.split('\n');
  const rows=Math.max(12,Math.floor(window.innerHeight/24)-3);
  for(let i=0;i<rows;i++){
    if(i<lines.length)P(esc(lines[i]));
    else P('<span class="bl">~</span>');
  }
  P('<span class="wh" style="background:#264f78"> "'+esc(file)+'" '+lines.length+'L, '+src.length+'C — ketik <b class="bd">:q</b> lalu Enter untuk keluar </span>');
  sc();
}
function closeVim(){
  TERM.innerHTML=S.vimBackup;ensureBar();S.mode=S.remote?'remote':(S.msf?'msf':'shell');showBar();
}
function vimKey(k){
  if(S.vimColon){
    if(k==='Enter'){
      const c=S.vimCmd.trim();S.vimColon=false;S.vimCmd='';
      if(c==='q'||c==='q!'||c==='wq'||c==='x'){closeVim();return;}
      if(c==='w'){/* write noop */return;}
      return;
    }
    if(k==='Backspace'){S.vimCmd=S.vimCmd.slice(0,-1);return;}
    if(k==='Escape'){S.vimColon=false;S.vimCmd='';return;}
    if(k.length===1)S.vimCmd+=k;
  }else if(k===':'){S.vimColon=true;}
}
function openPager(lines){
  S.snap=TERM.innerHTML;S.pagerBack=S.mode;S.mode='pager';hideBar();TERM.innerHTML='';
  for(const l of lines)P(l);BL();
  P('<span class="gy">(END) — tekan q untuk keluar</span>');sc();
}
function closePager(){TERM.innerHTML=S.snap;ensureBar();S.mode=S.pagerBack;showBar();}

/* ══════════════ input routing ══════════════ */
function histNav(dir){
  if(!S.hist.length)return;
  S.histIdx=Math.max(0,Math.min(S.hist.length,S.histIdx+dir));
  buf=S.histIdx===S.hist.length?'':S.hist[S.histIdx];
  renderBar();
}
function doTab(){
  const names=Object.keys(CMDS).concat(['./ops/breach.sh','ops/','wordlists/']);
  const sp=buf.lastIndexOf(' ');
  const token=buf.slice(sp+1);
  if(!token)return;
  const cands=names.filter(n=>n.startsWith(token));
  if(cands.length===1){buf=buf.slice(0,sp+1)+(cands[0].endsWith('/')?cands[0]:cands[0]+' ');renderBar();}
  else if(cands.length>1){freezeTyped(buf);P(cands.join('   '),'gy');renderBar();}
}
function routeChar(ch){
  if(ch==='\n'){routeEnter();return;}
  if(S.mode==='boot'){S.fast=true;return;}
  if(S.mode==='off'){restart();return;}
  if(S.mode==='vim'||S.mode==='pager')return;
  if(CAPT){CAPT.buf+=ch;renderBar();return;}
  if(S.mode==='busy')return;
  buf+=ch;renderBar();
}
function routeBackspace(){
  if(S.mode==='vim'){if(S.vimColon)vimKey('Backspace');return;}
  if(S.mode==='pager')return;
  if(CAPT){CAPT.buf=CAPT.buf.slice(0,-1);renderBar();return;}
  if(S.mode==='busy')return;
  buf=buf.slice(0,-1);renderBar();
}
function routeEnter(){
  if(S.mode==='boot'){S.fast=true;return;}
  if(S.mode==='off'){restart();return;}
  if(S.mode==='vim'){vimKey('Enter');return;}
  if(S.mode==='pager'){closePager();return;}
  if(CAPT){const v=CAPT.buf;finishCapt(v);return;}
  if(S.mode==='busy')return;
  const line=buf;buf='';
  P(promptHTML()+esc(line));
  if(S.mode==='shell'){busy('shell',()=>runShell(line));}
  else if(S.mode==='remote'){busy('remote',()=>runRemote(line));}
  else if(S.mode==='msf'){busy('msf',()=>runMsf(line));}
  else if(S.mode==='py'){const m=S.remote?'remote':'shell';busy(m,()=>runPy(line));}
}
document.addEventListener('keydown',e=>{
  CAP.focus();
  const k=e.key;
  if(S.mode==='off'){if(k.length===1||k==='Enter'){e.preventDefault();restart();}return;}
  if(S.mode==='boot'){if(k.length===1||k==='Enter'){S.fast=true;}return;}
  if(S.mode==='pager'){if(k==='q'||k==='Q'||k==='Escape'){closePager();e.preventDefault();}return;}
  if(S.mode==='vim'){if(k==='Escape')vimKey('Escape');else if(k.length===1)vimKey(k);else if(k==='Enter')vimKey('Enter');else if(k==='Backspace')vimKey('Backspace');e.preventDefault();return;}
  if(e.ctrlKey){
    if(k==='c'||k==='C'){
      e.preventDefault();
      if(S.mode==='busy'){S.aborted=true;return;}
      if(CAPT){P('<span class="wh">'+esc(CAPT.prompt)+'</span>'+(CAPT.masked?'':esc(CAPT.buf))+'<span class="rd">^C</span>');const r=CAPT.res;CAPT=null;r(null);return;}
      freezeTyped(buf,'^C');buf='';renderBar();return;
    }
    if(k==='l'||k==='L'){e.preventDefault();if(S.mode!=='busy'){TERM.innerHTML='';ensureBar();renderBar();}return;}
    return;
  }
  if(k==='Enter'){e.preventDefault();routeEnter();return;}
  if(k==='Backspace'){e.preventDefault();routeBackspace();return;}
  if(k==='Tab'){e.preventDefault();if(S.mode==='shell'&&!CAPT)doTab();return;}
  if(k==='ArrowUp'){e.preventDefault();if(S.mode==='shell'&&!CAPT)histNav(-1);return;}
  if(k==='ArrowDown'){e.preventDefault();if(S.mode==='shell'&&!CAPT)histNav(1);return;}
  if(k.length===1){CAPT||S.mode!=='busy'||null;}
});
/* karakter via textarea (desktop + mobile) */
CAP.addEventListener('input',()=>{
  const v=CAP.value;CAP.value='';
  if(v)for(const ch of v)routeChar(ch);
});
CAP.addEventListener('beforeinput',e=>{
  if(e.inputType&&e.inputType.indexOf('delete')===0){e.preventDefault();routeBackspace();}
});
function focusCap(){try{CAP.focus({preventScroll:true});}catch(_){CAP.focus();}}
document.addEventListener('click',focusCap);
document.addEventListener('touchstart',focusCap,{passive:true});
window.addEventListener('load',focusCap);
setInterval(()=>{if(document.activeElement!==CAP)focusCap();},1500);

function restart(){TERM.innerHTML='';ensureBar();S.fast=false;S.root=false;S.remote=null;S.msf=null;CAPT=null;buf='';boot();}

/* ══════════════ start ══════════════ */
