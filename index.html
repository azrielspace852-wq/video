  uniform vec2 uRes;

  uniform vec3 uTint;

  float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33);

  uniforms:{ tComp:{value:null},tWide:{value:null},
    uRes:{value:new THREE.Vector2(curW,curH)},
    uTime:{value:0},uGrain:{value:0.055},uCA:{value:0.0022},uVig:{value:0.55},uHal:{value:0.5},uExpo:{value:1.15},

        aRand=new Float32Array(N), aPart=new Float32Array(N), aSize=new Float32Array(N), aGroup=new Float32Array(N);

  const nodes=[];
  for(let i=0;i<90;i++){ sphDir(d); nodes.push([d[0]*2.55,d[1]*2.55*1.32,d[2]*2.55]); }
  const segs=[];

    const ax=[gauss(),gauss(),gauss()]; const L=Math.hypot(ax[0],ax[1],ax[2])||1;
    const x=ax[0]/L,y=ax[1]/L,z=ax[2]/L,c=Math.cos(ang),s=Math.sin(ang),ic=1-c;
    const [vx,vy,vz]=v;

             (y*x*ic+z*s)*vx+(c+y*y*ic)*vy+(y*z*ic-x*s)*vz,

    tree[i3+1]=sg[1]+(sg[4]-sg[1])*tt+gauss()*jg;
    tree[i3+2]=sg[2]+(sg[5]-sg[2])*tt+gauss()*jg;

function buildLines(){
  const nodes=[];
  for(let i=0;i<90;i++){ const d=[0,0,0]; sphDir(d); nodes.push([d[0]*2.55,d[1]*2.55*1.32,d[2]*2.55]); }
  const syn=[]; const seen=new Set();
  for(let i=0;i<90;i++){
    const dists=[];
    for(let j=0;j<90;j++){ if(i===j) continue;
      const dx=nodes[i][0]-nodes[j][0],dy=nodes[i][1]-nodes[j][1],dz=nodes[i][2]-nodes[j][2];
      dists.push([dx*dx+dy*dy+dz*dz,j]); }
    dists.sort((a,b)=>a[0]-b[0]);
    for(let k=0;k<3;k++){ const j=dists[k][1];
      if(dists[k][0]>2.9) break;
      const key=Math.min(i,j)+'_'+Math.max(i,j);
      if(seen.has(key)) continue; seen.add(key);
      syn.push([...nodes[i],...nodes[j]]);
      if(syn.length>=330) break; }
    if(syn.length>=330) break;
  }
  const beams=[], panelPos=[], phases=[];
  for(let i=0;i<64;i++){
    const d=[0,0,0]; sphDir(d); d[1]*=1.6;
    const L=Math.hypot(d[0],d[1],d[2]); const R=3.2+rnd()*0.6;
    const p=[d[0]/L*R, d[1]/L*R-0.3, d[2]/L*R];
    beams.push([0,-0.3,0,p[0],p[1],p[2]]);
    panelPos.push(p); phases.push(rnd());
  }
  const total=syn.length+64;
  const posArr=new Float32Array(total*6), aT=new Float32Array(total*2),
        aPh=new Float32Array(total*2), aK=new Float32Array(total*2);
  let o=0;
  for(const s of syn){ posArr.set(s,o*6); aT[o*2]=0;aT[o*2+1]=1;
    const ph=rnd(); aPh[o*2]=ph;aPh[o*2+1]=ph; aK[o*2]=0;aK[o*2+1]=0; o++; }
  for(let i=0;i<64;i++){ posArr.set(beams[i],o*6); aT[o*2]=0;aT[o*2+1]=1;
    aPh[o*2]=phases[i];aPh[o*2+1]=phases[i]; aK[o*2]=1;aK[o*2+1]=1; o++; }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(posArr,3));
  geo.setAttribute('aT',new THREE.BufferAttribute(aT,1));
  geo.setAttribute('aPhase',new THREE.BufferAttribute(aPh,1));
  geo.setAttribute('aKind',new THREE.BufferAttribute(aK,1));
  geo.boundingSphere=new THREE.Sphere(new THREE.Vector3(),30);
  return {geo,panelPos,phases};
}

function makeTextMat(tex,color){
  return new THREE.ShaderMaterial({
    uniforms:{uMap:{value:tex},uColor:{value:new THREE.Color(...color)},
      uOpacity:{value:0},uReveal:{value:0},uGlitch:{value:0},uSweep:{value:-1},uTime:{value:0}},
    transparent:true, depthWrite:false, depthTest:false, blending:THREE.AdditiveBlending,
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      uniform sampler2D uMap; uniform vec3 uColor;
      uniform float uOpacity,uReveal,uGlitch,uSweep,uTime;
      varying vec2 vUv;
      float h21(vec2 p){ p=fract(p*vec2(234.34,435.345)); p+=dot(p,p+34.23); return fract(p.x*p.y); }
      void main(){
        vec2 uv=vUv;
        if(uGlitch>0.001){
          float row=floor(uv.y*42.0); float fr=floor(uTime*20.0);
          float gate=step(0.72,h21(vec2(row,fr+7.0)));
          uv.x+=(h21(vec2(row,fr))-0.5)*0.14*uGlitch*gate;
        }
        vec4 tx=texture2D(uMap,uv);
        float edge=h21(vec2(floor(uv.y*48.0),17.0))*0.16;
        float rev=uReveal*1.28-0.14;
        float mask=smoothstep(rev+0.04+edge, rev-0.06+edge, uv.x);
        float sw=exp(-pow((uv.x-uSweep)*7.5,2.0))*step(0.0,uSweep)*step(uSweep,1.3);
        vec3 col=uColor*tx.rgb*(1.0+sw*3.0);
        gl_FragColor=vec4(col*1.35, tx.a*uOpacity*mask);
      }`
  });
}

/* ============================================================
   UPDATE + RENDER — 3D → DOF → bloom → teks tajam → grade
============================================================ */
const uwArr=pUniforms.uW.value;
function updateScene(){
  const tt=S.t;
  camera.fov=S.fov; camera.updateProjectionMatrix();
  const nx=n1(tt,0.9,1.3)*S.drift, ny=n1(tt,0.73,5.1)*S.drift,
        nz2=n1(tt,0.82,9.3)*S.drift, nr=n1(tt,0.6,7.7);
  const cx=Math.sin(S.camA)*S.camR+S.tx, cz=Math.cos(S.camA)*S.camR+S.tz, cy=S.camY+S.ty;
  camera.position.set(cx+nx, cy+ny*0.8, cz+nz2*0.6);
  camera.lookAt(S.tx+nx*0.35, S.ty+ny*0.35, S.tz);
  camera.rotation.z += S.roll + nr*0.0035*(S.drift/0.06);
  pUniforms.uPix.value = curH/(2*Math.tan(camera.fov*Math.PI/360));

  uwArr[0]=S.w0; uwArr[1]=S.w1; uwArr[2]=S.w2; uwArr[3]=S.w3; uwArr[4]=S.w4;
  pUniforms.uFinale.value=S.finale; pUniforms.uBirth.value=S.birth; pUniforms.uImp.value=S.imp;
  pUniforms.uDisperse.value=S.disperse; pUniforms.uExplode.value=S.explode; pUniforms.uSuck.value=S.suck;
  pUniforms.uCompress.value=S.compress; pUniforms.uLock.value=S.lock; pUniforms.uWave.value=S.wave;
  pUniforms.uRingR.value=S.ringR; pUniforms.uRingA.value=S.ringA;
  pUniforms.uTime.value=tt; pUniforms.uJitter.value=S.jitter;
  pUniforms.uOrbit.value=tt*0.24; pUniforms.uOpacity.value=S.pOp; pUniforms.uIntensity.value=S.intensity;

  points.rotation.y=S.coinRot;

  lines.visible=(S.lineOp0+S.lineOp1)>0.002;
  lUniforms.uTime.value=tt; lUniforms.uOp0.value=S.lineOp0; lUniforms.uOp1.value=S.lineOp1;
  lUniforms.uSpeed.value=S.lineSpeed;
  lUniforms.uColSyn.value.setRGB(S.lsr,S.lsg,S.lsb);

  panels.visible=S.panelsOp>0.002;
  panelMat.uniforms.uTime.value=tt; panelMat.uniforms.uOp.value=S.panelsOp;

  core.visible=S.coreOp>0.002;
  const cs=S.coreScale*2.2*(1+S.corePulse*0.3*Math.sin(tt*7.0));
  core.scale.set(cs,cs,1);
  core.material.opacity=S.coreOp;

  emblem.visible=S.emblemOp>0.002;
  emblem.material.opacity=S.emblemOp; emblem.rotation.y=S.coinRot;

  const cardState=[
    ['intro',S.introOp,S.introOp,S.introGlitch,-1],
    ['acc',S.accOp,S.accOp,0,-1],
    ['ai',S.aiOp,S.aiOp,0,-1],
    ['ads',S.adsOp,S.adsOp,0,-1],
    ['coin',S.coinOp,S.coinOp,0,-1],
    ['fin',S.finOp,S.finOp,0,S.finSweep],
  ];
  for(const [name,op,rev,gl,sw] of cardState){
    const m=cards[name];
    m.visible=op>0.001;
    if(m.visible){
      const b=cardBaseY[name];
      m.position.y=b.y+0.006*Math.sin(tt*0.6+b.ph);
      const u=m.material.uniforms;
      u.uOpacity.value=op; u.uReveal.value=rev; u.uGlitch.value=gl; u.uSweep.value=sw; u.uTime.value=tt;
    }
  }

  matComp.uniforms.uFocus.value=S.focus; matComp.uniforms.uAp.value=S.ap;
  const g=matGrade.uniforms;
  g.uTime.value=tt; g.uGrain.value=S.grain; g.uCA.value=0.0022*S.ca;
  g.uTint.value.setRGB(S.tintR,S.tintG,S.tintB);
}
function renderFrame(t){
  TL.seek(t,false);
  S.t=t;
  updateScene();
  // 1) scene 3D → rtScene (+depth)
  renderer.setRenderTarget(rtScene); renderer.render(scene,camera);
  // 2) DOF blur (half res)
  matBlur.uniforms.uRad.value=2.0;
  matBlur.uniforms.tSrc.value=rtScene.texture; matBlur.uniforms.uDir.value.set(1,0);
  matBlur.uniforms.uTexel.value.set(1/curW,1/curH); runPass(matBlur,rtH2);
  matBlur.uniforms.uRad.value=2.8;
  matBlur.uniforms.tSrc.value=rtH2.texture; matBlur.uniforms.uDir.value.set(0,1);
  matBlur.uniforms.uTexel.value.set(2/curW,2/curH); runPass(matBlur,rtH3);
  // 3) bloom half
  matBright.uniforms.tSrc.value=rtScene.texture; runPass(matBright,rtH1);
  matBlur.uniforms.uRad.value=1.4;
  matBlur.uniforms.tSrc.value=rtH1.texture; matBlur.uniforms.uDir.value.set(1,0);
  matBlur.uniforms.uTexel.value.set(2/curW,2/curH); runPass(matBlur,rtH2);
  matBlur.uniforms.tSrc.value=rtH2.texture; matBlur.uniforms.uDir.value.set(0,1); runPass(matBlur,rtH1);
  // 4) bloom wide (quarter) utk halation
  matBlur.uniforms.uRad.value=2.5;
  matBlur.uniforms.tSrc.value=rtH1.texture; matBlur.uniforms.uDir.value.set(1,0);
  matBlur.uniforms.uTexel.value.set(2/curW,2/curH); runPass(matBlur,rtQ1);
  matBlur.uniforms.tSrc.value=rtQ1.texture; matBlur.uniforms.uDir.value.set(0,1);
  matBlur.uniforms.uTexel.value.set(4/curW,4/curH); runPass(matBlur,rtQ2);
  // 5) composite 3D (DOF+bloom) → rtComp
  matComp.uniforms.tScene.value=rtScene.texture;
  matComp.uniforms.tDof.value=rtH3.texture;
  matComp.uniforms.tBloom.value=rtH1.texture;
  matComp.uniforms.tDepth.value=rtScene.depthTexture;
  runPass(matComp,rtComp);
  // 6) TEXT LAYER — digambar tajam di atas rtComp (TIDAK kena DOF/bloom)
  renderer.setRenderTarget(rtComp);
  renderer.autoClearColor=false;
  renderer.render(textScene,textCam);
  renderer.autoClearColor=true;
  // 7) final grade (grain/CA/vignette/halation/ACES) → layar
  matGrade.uniforms.tComp.value=rtComp.texture;
  matGrade.uniforms.tWide.value=rtQ2.texture;
  renderer.setRenderTarget(null); runPass(matGrade,null);
}

/* ============================================================
   PLAYER
============================================================ */
let playing=false, tCur=0, exporting=false;
const prm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function setPlaying(p){ playing=p; $('btnPlay').textContent=p?'❚❚ JEDA':'▶ PUTAR'; }
let last=performance.now();
function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(playing&&!exporting){ tCur+=dt; if(tCur>=40){ tCur=40; setPlaying(false); } }
  renderFrame(tCur);
  $('time').textContent=tCur.toFixed(1)+'s / 40.0s';
}

/* ============================================================
   EXPORT ENGINE — WebCodecs + mp4-muxer (mengikuti §11 ketat)
============================================================ */
function codecFor(W,fps){                                  // 11.3 — codec per resolusi
  if(W<=1080) return 'avc1.640028';                        // High L4.0 (1080 @30/60)
  return fps>=60 ? 'avc1.640034' : 'avc1.640033';          // 4K L5.2 / L5.1
}
function setStat(msg,cls){ const s=$('stat'); s.textContent=msg; s.className=cls||''; }
async function startExport(){
  if(exporting) return;
  setStat('MEMERIKSA KAPABILITAS ENCODER…','');
  $('bar').style.width='0%';
  /* 11.10 — feature detection */
  if(typeof window.VideoEncoder==='undefined'){
    setStat('WEBCODECS TIDAK TERSEDIA — GUNAKAN GOOGLE CHROME / EDGE DESKTOP','err'); return;
  }
  let muxMod;
  try{ muxMod=await import('mp4-muxer'); }
  catch(e){ setStat('LIBRARY mp4-muxer GAGAL DIMUAT — PERIKSA KONEKSI CDN','err'); return; }
  const { Muxer, ArrayBufferTarget }=muxMod;

  const W=+$('selRes').value, H=Math.round(W*16/9), fps=+$('selFps').value;
  const codec=codecFor(W,fps);
  const bitrate=W>=2160?60000000:24000000;
  /* 11.3 — isConfigSupported wajib */
  let support;
  try{
    support=await VideoEncoder.isConfigSupported({codec,width:W,height:H,framerate:fps,bitrate});
  }catch(e){
    setStat('GAGAL MENGUJI CODEC: '+e.message,'err'); return;
  }
  if(!support.supported){
    setStat(`CODEC ${codec} ${W}×${H}@${fps}FPS TIDAK DIDUKUNG DEVICE INI`,'err'); return;
  }

  exporting=true; setPlaying(false);
  const btnDl=$('btnDl'),btnP=$('btnPlay'),selR=$('selRes'),selF=$('selFps');
  btnDl.disabled=true; btnP.disabled=true; selR.disabled=true; selF.disabled=true;
  const savedT=tCur;
  let encoder=null, muxer=null, encErr=null, failedFrame=-1;
  const total=40*fps;
  try{
    /* 11.2 — canvas HARUS persis = config encoder */
    renderer.setPixelRatio(1);
    renderer.setSize(W,H,false);
    setPipelineSize(W,H);
    setStat(`EXPORT DIMULAI — ${W}×${H} @ ${fps}FPS (${total} FRAME)…`,'');

    muxer=new Muxer({ target:new ArrayBufferTarget(),
      video:{codec:'avc',width:W,height:H,frameRate:fps},
      fastStart:'in-memory', firstTimestampBehavior:'offset' });
    encoder=new VideoEncoder({
      output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),
      error:e=>{ encErr=e; }
    });
    encoder.configure({codec,width:W,height:H,bitrate,framerate:fps});

    const frameDur=Math.round(1000000/fps);
    const t0=performance.now();
    for(let f=0;f<total;f++){
      failedFrame=f;
      if(encErr) throw encErr;
      if(encoder.state==='closed'||encoder.state==='errored') throw new Error('encoder tertutup sebelum selesai');
      renderFrame(f/fps);                                   // deterministik: seek + render
      /* 11.4 — timestamp mikrodtk, monoton; 11.5 — frame sinkron dr canvas */
      const vf=new VideoFrame(canvas,{timestamp:Math.round(f*1000000/fps),duration:frameDur});
      encoder.encode(vf,{keyFrame:(f%(fps*2))===0});
      vf.close();                                           // 14 — hindari leak
      /* 11.6 — backpressure */
      while(encoder.encodeQueueSize>4){ await raf(); if(encErr) throw encErr; }
      if((f+1)%240===0){ await encoder.flush(); }           // drain berkala utk export panjang
      if(f%4===0){
        const pct=((f+1)/total*100);
        const el=(performance.now()-t0)/1000;
        const eta=Math.ceil(el/(f+1)*(total-f-1));
        $('bar').style.width=pct.toFixed(1)+'%';
        setStat(`FRAME ${f+1}/${total} · ${pct.toFixed(0)}% · ETA ±${eta}s — EXPORT LEBIH LAMA DARI 40 DETIK ITU NORMAL`,'');
        await raf();
      }
    }
    failedFrame=-1;
    setStat('FLUSHING ENCODER…','');
    await encoder.flush();                                  // 11.7 — flush SEBELUM finalize
    encoder.close(); encoder=null;
    muxer.finalize();
    const buf=muxer.target.buffer;
    if(!buf||buf.byteLength===0) throw new Error('muxer menghasilkan buffer 0 byte');
    const blob=new Blob([buf],{type:'video/mp4'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='AXION-Neuralis-Teaser-9x16.mp4';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    $('bar').style.width='100%';
    setStat(`SELESAI — ${(blob.size/1048576).toFixed(1)} MB · AXION-Neuralis-Teaser-9x16.mp4 DIUNDUH`,'ok');
  }catch(e){
    /* 11.8 — error spesifik + lokasi frame */
    const where=failedFrame>=0?` — GAGAL SAAT ENCODE FRAME ${failedFrame+1}/${total}`:'';
    const msg=e&&e.message?e.message:String(e);
    let hint='';
    if(/codec/i.test(msg)) hint=' (codec tidak didukung browser ini)';
    setStat('EXPORT GAGAL'+where+': '+msg+hint,'err');
    try{ if(encoder&&encoder.state!=='closed') encoder.close(); }catch(_){}
  }finally{
    exporting=false;
    layoutPreview(); renderFrame(savedT);
    btnDl.disabled=false; btnP.disabled=false; selR.disabled=false; selF.disabled=false;
  }
}

/* ============================================================
   LAYOUT & BOOT
============================================================ */
function layoutPreview(){
  const box=$('stage').getBoundingClientRect();
  const pr=Math.min(window.devicePixelRatio||1,2);          // 7.3 — HiDPI
  renderer.setPixelRatio(pr);
  const bufH=Math.min(1920,Math.max(480,Math.round(box.height*pr)));
  const bufW=Math.round(bufH*9/16);
  renderer.setSize(bufW/pr,bufH/pr,false);                  // drawing buffer = bufW×bufH
  setPipelineSize(bufW,bufH);
}
window.addEventListener('resize',()=>{ if(!exporting) layoutPreview(); });
window.addEventListener('pagehide',()=>{
  try{
    renderer.dispose();
    [rtScene,rtH1,rtH2,rtH3,rtQ1,rtQ2,rtComp].forEach(r=>r.dispose());
  }catch(e){}
});

async function boot(){
  try{
    await Promise.all([
      document.fonts.load('700 100px "Unbounded"'),
      document.fonts.load('400 100px "Unbounded"'),
      document.fonts.load('300 100px "Unbounded"'),
      document.fonts.load('500 32px "IBM Plex Mono"'),
      document.fonts.load('400 32px "IBM Plex Mono"'),
    ]).catch(()=>{});
    buildEmblem();
    buildCards();
    buildTimeline();
    layoutPreview();
    renderFrame(0);
    requestAnimationFrame(t=>{ last=t; tick(t); });
    $('boot').classList.add('off');
    setStat('SIAP — 40.00s · 9:16 · H.264 · TANPA AUDIO','ok');
    if(!prm){ tCur=0; setPlaying(true); }
  }catch(e){
    document.querySelector('#boot .s').textContent='ERROR: '+e.message;
  }
}
$('btnPlay').addEventListener('click',()=>{
  if(exporting) return;
  if(!playing&&tCur>=40) tCur=0;
  setPlaying(!playing);
});
$('btnDl').addEventListener('click',startExport);
boot();
