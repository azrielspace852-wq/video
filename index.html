<!--
═══════════════════════════════════════════════════════════════════════════
 KALI LINUX TERMINAL — CINEMATIC AUTO-PLAY (final build untuk TikTok)
───────────────────────────────────────────────────────────────────────────
 ANALISIS MASALAH VERSI SEBELUMNYA:
 [M1] Menunggu input manual (login → ketik sendiri) → layar "diam" saat
      dibuka; tidak cocok untuk video.
 [M2] Rendering DOM → tidak bisa direkam menjadi file video secara
      pixel-perfect.
 [M3] Tidak ada perekam/export WebM.
 [M4] Layar horizontal; format TikTok butuh 9:16 vertikal.
 [M5] Beberapa penanda "simulasi" (judul/label) masih terlihat.

 PERBAIKAN:
 [F1] AUTO-PLAY: begitu halaman dibuka, sesi hacking langsung berjalan —
      boot kernel → login tty1 → recon (nmap, gobuster) → kredensial
      bocor (.env) → brute force (hydra) → akses SSH → enumerasi
      (whoami, sudo -l) → privilege escalation (GTFOBins vim) → root →
      flag → logout. Loop otomatis untuk preview.
 [F2] Renderer CANVAS 1080×1920 (9:16) — output identik dengan hasil
      rekaman, font JetBrains Mono, prompt asli zsh Kali:
      ┌──(kali㉿kali)-[~] / └─$  (dan prompt remote/root target).
 [F3] Detail manusiawi agar tidak terlihat simulasi: kecepatan ketik
      bervariasi, jeda "mikir" sebelum Enter, satu typo + backspace,
      password tidak ditampilkan (masked), kursor blok berkedip.
 [F4] Tombol "⏺ REKAM & SIMPAN WEBM": skenario diulang dari awal sambil
      direkam (canvas.captureStream 30fps + MediaRecorder VP9 ~9 Mbps),
      berhenti otomatis di akhir, file .webm langsung terunduh.
      Tombol ⏹ STOP untuk henti lebih awal. HUD/tombol adalah DOM
      sehingga TIDAK ikut terekam ke video.
 [F5] Fallback codec (vp9 → vp8 → webm → mp4) + pesan error jelas bila
      browser tidak mendukung.

 VERIFIKASI (review statis alur):
 [V1] runId/token membatalkan preview lama saat rekaman dimulai → tidak
      ada dua skenario berjalan bersamaan.
 [V2] reset() dipanggil sebelum setiap run → tidak ada sisa frame.
 [V3] onstop MediaRecorder → Blob → download otomatis; timer dibersihkan.
 [V4] Semua target fiktif (192.168.1.20, SOW-2026-0814) dalam konteks
      pentest resmi; tidak ada fungsionalitas nyata yang berbahaya.
═══════════════════════════════════════════════════════════════════════════
-->

<script>
'use strict';
/* ═══════════════ konstanta renderer ═══════════════ */
const W=1080,H=1920,FONT=34,LH=46,PADX=44,PADT=52;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const CLR={w:'#dcdcdc',g:'#8a938a',b:'#5c9dff',c:'#37d2ff',gr:'#4af626',
           r:'#ff5555',y:'#ffd75f',m:'#d0a5ff',W:'#ffffff'};
let charW=20,COLS=48,ROWS=39;

/* model teks */
const lines=[];   // baris visual final (wrapped): [{t,c},...]
let cur=[];       // baris berjalan
let typing=false;

const state={runId:0,recording:false};

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a));
const seg=(...p)=>p.map(([t,c])=>({t,c}));
const L=(t,c,d)=>({s:seg([t,c]),d});

/* ═══════════════ wrap / push / edit ═══════════════ */
function wrap(s){
  const out=[];let row=[],n=0;
  for(const g of s){
    let t=g.t;
    while(n+t.length>COLS){
      const k=COLS-n;
      if(k>0)row.push({t:t.slice(0,k),c:g.c});
      out.push(row);row=[];n=0;t=t.slice(k);
    }
    if(t.length){row.push({t,c:g.c});n+=t.length;}
  }
  out.push(row);return out;
}
function pushSegs(s){for(const r of wrap(s))lines.push(r);}
function newline(){if(cur.length)pushSegs(cur);cur=[];}
function append(t,c){
  const last=cur[cur.length-1];
  if(last&&last.c===c)last.t+=t;else cur.push({t,c});
}
function backspace(){
  while(cur.length){
    const last=cur[cur.length-1];
    last.t=last.t.slice(0,-1);
    if(last.t.length)return;
    cur.pop();
  }
}
function reset(){lines.length=0;cur=[];}

/* ═══════════════ prompt ═══════════════ */
const pKali1=()=>seg(['┌──(','b'],['kali','c'],['㉿','r'],['kali','c'],[')-[','b'],['~','m'],[']','b']);
const pKali2=()=>seg(['└─','b'],['$','b'],[' ','w']);
const pRem=(u,root)=>seg([u+'@web-prod-01','gr'],[':','w'],['~','b'],[root?'# ':'$ ','w']);

/* ═══════════════ mesin aksi ═══════════════ */
async function emit(items,d){for(const it of items){if(DEAD())return;pushSegs(it.s);await sleep(it.d??d??26);}}
async function pause(ms){if(!DEAD())await sleep(ms);}
async function typeText(text,opt){
  opt=opt||{};
  const min=opt.min??34,max=opt.max??78,color=opt.color||'w';
  typing=true;
  for(const ch of text){
    if(DEAD()){typing=false;return;}
    append(ch,color);
    await sleep(rand(min,max)+(ch===' '?14:0)+((ch==='-'||ch==='.')?10:0));
  }
  typing=false;
}
async function maskInput(promptSegs,dur){
  newline();cur=promptSegs.slice();
  await pause(320);await sleep(dur||900);newline();
}
async function kali(p1,p2,cmd){
  newline();
  if(p1)pushSegs(p1);
  cur=p2?p2.slice():[];
  await pause(260);
  await typeText(cmd);
  await pause(rand(300,560));
  newline();
}

/* ═══════════════ render loop ═══════════════ */
function draw(now){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.textBaseline='top';ctx.font='400 '+FONT+'px "JetBrains Mono", monospace';
  const curVis=wrap(cur);
  const total=lines.length+curVis.length;
  const start=Math.max(0,total-ROWS);
  const drawRow=(row,y)=>{
    let x=PADX;
    for(const s of row){
      ctx.fillStyle=CLR[s.c]||CLR.w;
      ctx.fillText(s.t,x,y+6);
      x+=ctx.measureText(s.t).width;
    }
  };
  let vi=0;
  for(let i=start;i<lines.length;i++,vi++)drawRow(lines[i],PADT+vi*LH);
  for(let j=0;j<curVis.length;j++,vi++)drawRow(curVis[j],PADT+vi*LH);
  const blink=typing||Math.floor(now/530)%2===0;
  if(blink){
    const lastRow=curVis[curVis.length-1]||[];
    let wpx=0;for(const s of lastRow)wpx+=ctx.measureText(s.t).width;
    const y=PADT+(vi-1)*LH;
    ctx.fillStyle='#dcdcdc';
    ctx.fillRect(PADX+wpx,y+5,charW-2,LH-9);
  }
  requestAnimationFrame(draw);
}

/* ═══════════════ perekaman WebM ═══════════════ */
const btnRec=document.getElementById('btnRec'),
      btnStop=document.getElementById('btnStop'),
      statusEl=document.getElementById('status');
let rec=null,chunks=[],recTimer=null,recStart=0;

function pickMime(){
  const c=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
  for(const m of c)if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;
  return null;
}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');}
const setStatus=h=>{statusEl.innerHTML=h;};

async function playScript(){state.runId++;reset();await runScript();}
async function previewLoop(){
  for(;;){
    if(state.recording)return;
    await playScript();
    if(state.recording)return;
    await sleep(2600);
  }
}
btnRec.addEventListener('click',async()=>{
  if(state.recording)return;
  const mime=pickMime();
  const cap=cv.captureStream||cv.mozCaptureStream||cv.webkitCaptureStream;
  if(!mime||!cap){setStatus('❌ Browser tidak mendukung MediaRecorder/captureStream. Gunakan Chrome/Edge/Firefox.');return;}
  state.runId++;                 // batalkan preview berjalan
  state.recording=true;
  reset();
  btnRec.disabled=true;btnStop.disabled=false;
  chunks=[];
  const stream=cap.call(cv,30);
  rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:9000000});
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  rec.onstop=()=>{
    clearInterval(recTimer);
    const blob=new Blob(chunks,{type:mime});
    const ext=mime.indexOf('mp4')>=0?'mp4':'webm';
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='kali-linux-hacking-1080x1920.'+ext;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    setStatus('✅ Selesai — file .'+ext+' ('+(blob.size/1048576).toFixed(1)+' MB) sedang diunduh');
    state.recording=false;btnRec.disabled=false;btnStop.disabled=true;
    previewLoop();
  };
  rec.start(250);
  recStart=Date.now();
  setStatus('<b>● REC</b> 00:00 — merekam…');
  recTimer=setInterval(()=>setStatus('<b>● REC</b> '+fmt((Date.now()-recStart)/1000)+' — merekam…'),400);
  await sleep(350);
  await runScript();
  if(state.recording&&rec&&rec.state==='recording'){
    await sleep(1400);
    if(state.recording&&rec&&rec.state==='recording')rec.stop();
  }
});
btnStop.addEventListener('click',()=>{
  if(state.recording&&rec&&rec.state==='recording'){state.runId++;rec.stop();}
});

/* ═══════════════ init ═══════════════ */
(async()=>{
  try{
    await Promise.all([
      document.fonts.load('400 '+FONT+'px "JetBrains Mono"'),
      document.fonts.load('700 '+FONT+'px "JetBrains Mono"')
    ]);
  }catch(_){/* fallback monospace */}
  ctx.font='400 '+FONT+'px "JetBrains Mono", monospace';
  charW=ctx.measureText('M').width||FONT*0.6;
  COLS=Math.floor((W-PADX*2)/charW);
  ROWS=Math.floor((H-PADT-44)/LH);
  requestAnimationFrame(draw);
  setStatus('Preview berjalan — siap direkam (1080×1920 • 30fps)');
  previewLoop();
})();
</script>
