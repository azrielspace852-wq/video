<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<title>AXION Neuralis — Loading Screen</title>

<!-- Tipografi (fontsource CDN) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/cinzel@latest/latin-600.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/rajdhani@latest/latin-500.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/rajdhani@latest/latin-600.css" rel="stylesheet">

<style>
/* ============ TOKENS ============ */
:root{
  --bg:#0a0a0f;
  --blood:#8b0000;
  --crimson:#dc143c;
  --rose:#ff4d6d;
  --gold:#f5c469;
  --ink:#f4eeee;
  --dim:rgba(244,238,238,.52);
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Rajdhani','Segoe UI',sans-serif;
  min-height:100dvh;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ============ LATAR: CANVAS & CAHAYA ============ */
#sky{position:fixed;inset:0;z-index:1;display:block}

.glow{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:1;will-change:transform}
.glow-a{width:58vmax;height:58vmax;left:-20vmax;top:-24vmax;
  background:radial-gradient(circle,rgba(139,0,0,.55),transparent 62%);
  animation:driftA 17s ease-in-out infinite alternate}
.glow-b{width:50vmax;height:50vmax;right:-18vmax;bottom:-22vmax;
  background:radial-gradient(circle,rgba(220,20,60,.30),transparent 60%);
  animation:driftB 21s ease-in-out infinite alternate}
@keyframes driftA{to{transform:translate(6vmax,4vmax)}}
@keyframes driftB{to{transform:translate(-5vmax,-4vmax)}}

.vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(4,4,8,.55) 76%,rgba(2,2,5,.88) 100%)}

.grain{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:.055;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}

/* ============ TOMBOL DOWNLOAD ============ */
.dl-btn{
  position:fixed;z-index:9;
  left:50%;top:calc(50% + clamp(72px,13vh,132px));
  transform:translate(-50%,-50%);
  display:inline-flex;align-items:center;gap:11px;
  font-family:'Cinzel',serif;font-weight:600;
  font-size:.85rem;letter-spacing:.28em;text-indent:.1em;
  color:var(--ink);white-space:nowrap;
  padding:.95rem 2.3rem;
  background:rgba(220,20,60,.08);
  border:1px solid rgba(220,20,60,.55);border-radius:3px;
  cursor:pointer;overflow:hidden;
  text-shadow:0 0 12px rgba(220,20,60,.4);
  transition:box-shadow .4s ease,background .4s ease,border-color .4s ease,opacity .4s ease;
  animation:btnIn 1s .25s cubic-bezier(.22,1,.36,1) both}
@keyframes btnIn{from{opacity:0;transform:translate(-50%,-38%)}to{opacity:1;transform:translate(-50%,-50%)}}

.dl-btn::after{content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.16) 47%,rgba(245,196,105,.28) 53%,transparent 68%);
  transform:translateX(-130%);transition:transform .85s ease}
.dl-btn:hover:not(:disabled),.dl-btn:focus-visible:not(:disabled){
  border-color:var(--rose);
  background:rgba(220,20,60,.16);
  box-shadow:0 0 26px rgba(220,20,60,.6),0 0 60px rgba(139,0,0,.4),inset 0 0 18px rgba(220,20,60,.25);
  text-shadow:0 0 16px rgba(255,77,109,.8)}
.dl-btn:hover:not(:disabled)::after{transform:translateX(130%)}
.dl-btn:active:not(:disabled){transform:translate(-50%,-50%) scale(.97)}
.dl-btn:focus-visible{outline:1px solid rgba(245,196,105,.85);outline-offset:4px}
.dl-btn:disabled{cursor:default;opacity:.85}

.dl-btn .dot{width:7px;height:7px;border-radius:50%;flex:none;
  background:var(--gold);box-shadow:0 0 8px rgba(245,196,105,.85);opacity:.75;
  transition:background .3s,box-shadow .3s}
.dl-btn.rec .dot{background:var(--crimson);box-shadow:0 0 10px var(--crimson);
  animation:blink .9s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

.dl-note{
  position:fixed;z-index:9;left:50%;
  top:calc(50% + clamp(72px,13vh,132px) + 52px);
  transform:translateX(-50%);
  font-size:.7rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);text-align:center;max-width:92vw;min-height:1em}

@media (prefers-reduced-motion:reduce){
  .glow-a,.glow-b{animation:none}
  .dl-btn{animation-duration:.01s}
}
</style>
</head>
<body>

<!-- Latar partikel -->
<canvas id="sky" aria-hidden="true"></canvas>
<div class="glow glow-a" aria-hidden="true"></div>
<div class="glow glow-b" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<!-- Satu-satunya kontrol: tombol download -->
<button class="dl-btn" id="dlBtn" type="button">
  <span class="dot" aria-hidden="true"></span><span id="dlLabel">Download MP4</span>
</button>
<p class="dl-note" id="dlNote" aria-live="polite"></p>

<div class="grain" aria-hidden="true"></div>

<noscript>
  <p style="position:fixed;inset:auto 0 12px;text-align:center;color:#dc143c;z-index:99">
    AXION Neuralis membutuhkan JavaScript untuk menghidupkan cintanya.
  </p>
</noscript>

<!-- Muxer MP4 (dipakai bersama WebCodecs; fallback otomatis bila tak tersedia) -->
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js"></script>

<script>
(function(){
'use strict';

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a,b)=>a+Math.random()*(b-a);

/* ================= DOM ================= */
const canvas  = document.getElementById('sky');
const ctx     = canvas.getContext('2d');
const dlBtn   = document.getElementById('dlBtn');
const dlLabel = document.getElementById('dlLabel');
const dlNote  = document.getElementById('dlNote');

/* ================= STATE ================= */
let W=0, H=0, DPR=1;
const stars=[], hearts=[], meteors=[];
let meteorCountdown = 2.5;

/* progres loading (dipakai layar & perekaman) */
let progress=0, finished=false, pulseAt=-1e9;
let runStart=0, nextTick=0;

/* ================= PARTIKEL (koordinat normalisasi 0..1) ================= */
function makeStar(){
  return {
    nx:Math.random(), ny:Math.random(),
    rf:rand(0.0005,0.0016),            // radius (fraksi tinggi)
    a:rand(0.25,0.9),
    sp:rand(0.6,2.4), ph:rand(0,Math.PI*2),
    vnx:rand(-0.0016,-0.0003), vny:rand(-0.0007,0.0007),
    col: Math.random()<0.2 ? '#ffd9a0' : '#ffffff'
  };
}
function makeHeart(anywhere){
  return {
    nx:Math.random(),
    ny: anywhere ? Math.random() : 1 + rand(0.03,0.18),
    hf:rand(0.006,0.016),              // ukuran (fraksi tinggi)
    vy:rand(0.011,0.028),              // naik, fraksi tinggi / detik
    amp:rand(0.008,0.026),             // ayunan, fraksi lebar
    w:rand(0.4,1.1), ph:rand(0,Math.PI*2),
    a:rand(0.16,0.5),
    gold: Math.random()<0.18
  };
}
function buildField(){
  stars.length=0; hearts.length=0;
  for(let i=0;i<150;i++) stars.push(makeStar());
  for(let i=0;i<14;i++)  hearts.push(makeHeart(true));
}
function heartPath(c,k){
  c.beginPath();
  c.moveTo(0,6*k);
  c.bezierCurveTo(0,2*k,-5*k,-4*k,-11*k,-4*k);
  c.bezierCurveTo(-18*k,-4*k,-18*k,4*k,-18*k,4*k);
  c.bezierCurveTo(-18*k,9*k,-13*k,14*k,0,21*k);
  c.bezierCurveTo(13*k,14*k,18*k,9*k,18*k,4*k);
  c.bezierCurveTo(18*k,4*k,18*k,-4*k,11*k,-4*k);
  c.bezierCurveTo(5*k,-4*k,0,2*k,0,6*k);
  c.closePath();
}
function updateParticles(dt,t){
  const dm = REDUCED ? 0.25 : 1;
  for(const s of stars){
    s.nx += s.vnx*dt*dm; s.ny += s.vny*dt*dm;
    if(s.nx<-0.02)s.nx=1.02; if(s.nx>1.02)s.nx=-0.02;
    if(s.ny<-0.02)s.ny=1.02; if(s.ny>1.02)s.ny=-0.02;
  }
  for(let i=0;i<hearts.length;i++){
    const h=hearts[i];
    h.ny -= h.vy*dt*dm;
    if(h.ny < -0.05) hearts[i]=makeHeart(false);
  }
  if(!REDUCED){
    meteorCountdown -= dt;
    if(meteorCountdown<=0){
      meteors.push({nx:rand(-0.1,0.72), ny:rand(-0.05,0.25),
                    vnx:rand(0.19,0.31), vny:rand(0.15,0.29), life:1});
      meteorCountdown = rand(2.5,6);
    }
  }
  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i];
    m.nx += m.vnx*dt; m.ny += m.vny*dt; m.life -= dt*0.55;
    if(m.life<=0 || m.nx>1.1 || m.ny>1.1) meteors.splice(i,1);
  }
}
function drawParticles(c,w,h,t){
  /* bintang berkelap-kelip */
  for(const s of stars){
    const x=s.nx*w, y=s.ny*h, r=s.rf*h;
    const tw = REDUCED ? 0.75 : (0.5+0.5*Math.sin(t*s.sp+s.ph));
    const a = s.a*(0.3+0.7*tw);
    c.globalAlpha=a; c.fillStyle=s.col;
    c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill();
    if(r>1.15){ /* kilau silang bintang besar */
      const L=r*3.2*tw+1;
      c.globalAlpha=a*0.5; c.strokeStyle=s.col; c.lineWidth=0.6;
      c.beginPath();
      c.moveTo(x-L,y); c.lineTo(x+L,y);
      c.moveTo(x,y-L); c.lineTo(x,y+L);
      c.stroke();
    }
  }
  c.globalCompositeOperation='lighter';
  /* hati melayang */
  for(const h of hearts){
    const sPx=h.hf*h;
    const sway=Math.sin(t*h.w+h.ph)*h.amp*w;
    c.save();
    c.translate(h.nx*w+sway, h.ny*h);
    c.rotate(Math.sin(t*h.w+h.ph)*0.28);
    c.globalAlpha=h.a*(0.75+0.25*Math.sin(t*1.8+h.ph));
    c.fillStyle = h.gold ? 'rgba(245,196,105,.9)' : 'rgba(220,20,60,.9)';
    heartPath(c,sPx/30);
    c.fill();
    c.restore();
  }
  /* bintang jatuh */
  for(const m of meteors){
    const x=m.nx*w, y=m.ny*h;
    const tx=x-m.vnx*0.16*w, ty=y-m.vny*0.16*h;
    const g=c.createLinearGradient(x,y,tx,ty);
    g.addColorStop(0,'rgba(255,244,224,'+(0.95*m.life)+')');
    g.addColorStop(0.4,'rgba(245,196,105,'+(0.6*m.life)+')');
    g.addColorStop(1,'rgba(220,20,60,0)');
    c.globalAlpha=1; c.strokeStyle=g; c.lineWidth=1.6;
    c.beginPath(); c.moveTo(x,y); c.lineTo(tx,ty); c.stroke();
  }
  c.globalCompositeOperation='source-over';
  c.globalAlpha=1;
}

/* ================= PROGRESS BAR (digambar di canvas) ================= */
function roundRect(c,x,y,w2,h2,r){
  const rr=Math.min(r,w2/2,h2/2);
  c.beginPath();
  c.moveTo(x+rr,y);
  c.arcTo(x+w2,y,x+w2,y+h2,rr);
  c.arcTo(x+w2,y+h2,x,y+h2,rr);
  c.arcTo(x,y+h2,x,y,rr);
  c.arcTo(x,y,x+w2,y,rr);
  c.closePath();
}
function heartbeatEnv(t){ /* dua detak per siklus 1.5 dtk */
  const tt=t%1.5;
  const bump=(ctr,wd)=>Math.exp(-((tt-ctr)*(tt-ctr))/(wd*wd));
  return 0.9*bump(0.15,0.09)+0.5*bump(0.6,0.09);
}
function drawBar(c,w,h,now,t){
  const u=h/900;
  const barW=Math.min(w*0.62,470*u);
  const gap=18*u, pctW=64*u;
  const total=barW+gap+pctW;
  const x0=(w-total)/2, y=h*0.5;
  const p=progress/100;
  const th=Math.max(2.5,3*u);

  const since=(now-pulseAt)/340;
  const boost=since<1 ? (1-since) : 0;          // denyut tiap bertambah
  const hb=finished ? heartbeatEnv(t) : 0;       // detak setelah selesai
  const glow=1+boost*1.2+hb*0.9;

  /* track */
  c.fillStyle='rgba(255,255,255,0.08)';
  roundRect(c,x0,y-th/2,barW,th,th/2); c.fill();

  if(p>0.004){
    const fw=barW*p;
    /* fill merah menyala */
    c.save();
    c.shadowColor='rgba(220,20,60,'+Math.min(1,0.55+0.25*glow)+')';
    c.shadowBlur=(9+9*boost+10*hb)*u+6*u;
    const grad=c.createLinearGradient(x0,0,x0+barW,0);
    grad.addColorStop(0,'#8b0000');
    grad.addColorStop(0.45,'#dc143c');
    grad.addColorStop(0.78,'#ff4d6d');
    grad.addColorStop(1,'#ffd98a');
    c.fillStyle=grad;
    roundRect(c,x0,y-th/2,fw,th,th/2); c.fill();
    c.restore();
    /* kilatan denyut */
    if(boost>0){
      c.save();
      c.globalCompositeOperation='lighter';
      c.globalAlpha=boost*0.5;
      c.fillStyle='#ffb3c0';
      roundRect(c,x0,y-th/2,fw,th,th/2); c.fill();
      c.restore();
    }
    /* titik cahaya di ujung */
    c.save();
    c.globalCompositeOperation='lighter';
    const tg=c.createRadialGradient(x0+fw,y,0,x0+fw,y,9*u);
    tg.addColorStop(0,'rgba(255,255,255,.95)');
    tg.addColorStop(0.38,'rgba(255,157,176,.9)');
    tg.addColorStop(0.7,'rgba(220,20,60,.85)');
    tg.addColorStop(1,'rgba(220,20,60,0)');
    c.fillStyle=tg;
    c.beginPath(); c.arc(x0+fw,y,9*u*(1+boost*0.7+hb*0.3),0,Math.PI*2); c.fill();
    c.restore();
  }

  /* persentase */
  const scale=1+boost*0.2+hb*0.06;
  c.save();
  c.translate(x0+barW+gap,y);
  c.scale(scale,scale);
  c.textBaseline='middle'; c.textAlign='left';
  c.shadowColor='rgba(220,20,60,.55)'; c.shadowBlur=12*u;
  c.font='600 '+Math.round(26*u)+'px Rajdhani, sans-serif';
  c.fillStyle='#ffe9ec';
  const num=String(Math.round(progress));
  c.fillText(num,0,0);
  const nw=c.measureText(num).width;
  c.font='600 '+Math.round(14*u)+'px Rajdhani, sans-serif';
  c.fillStyle='rgba(245,196,105,.85)';
  c.fillText('%',nw+3*u,1*u);
  c.restore();
}

/* ================= SIMULASI LOADING ================= */
function resetRun(now){
  progress=0; finished=false; pulseAt=-1e9;
  runStart=now; nextTick=now+350;
}
function sim(now){
  if(finished || now<nextTick) return;
  let inc=rand(1.6,4.4);
  if(Math.random()<0.12) inc+=rand(3,6);      // lonjakan dramatis
  progress=Math.min(100,progress+inc);
  pulseAt=now;
  if(progress>=100){finished=true;return;}
  if(now-runStart>4100){progress=100;finished=true;return;} /* pengaman ±3–4 dtk */
  nextTick=now+rand(55,130);
}

/* ================= KANVAS REKAMAN (1080p, offscreen) ================= */
const REC_W=1920, REC_H=1080, REC_FPS=30, REC_BITRATE=10_000_000;
const recCanvas=document.createElement('canvas');
recCanvas.width=REC_W; recCanvas.height=REC_H;
const recCtx=recCanvas.getContext('2d');
let recVig=null;

function drawRecBackdrop(c){
  c.fillStyle='#0a0a0f'; c.fillRect(0,0,REC_W,REC_H);
  let g=c.createRadialGradient(REC_W*0.12,REC_H*0.1,0,REC_W*0.12,REC_H*0.1,Math.max(REC_W,REC_H)*0.62);
  g.addColorStop(0,'rgba(139,0,0,0.5)'); g.addColorStop(1,'rgba(139,0,0,0)');
  c.fillStyle=g; c.fillRect(0,0,REC_W,REC_H);
  g=c.createRadialGradient(REC_W*0.9,REC_H*0.92,0,REC_W*0.9,REC_H*0.92,Math.max(REC_W,REC_H)*0.55);
  g.addColorStop(0,'rgba(220,20,60,0.26)'); g.addColorStop(1,'rgba(220,20,60,0)');
  c.fillStyle=g; c.fillRect(0,0,REC_W,REC_H);
}
function getRecVignette(){
  if(recVig) return recVig;
  const g=recCtx.createRadialGradient(REC_W/2,REC_H/2,REC_H*0.28,REC_W/2,REC_H/2,Math.hypot(REC_W,REC_H)*0.53);
  g.addColorStop(0,'rgba(2,2,5,0)');
  g.addColorStop(0.62,'rgba(3,3,7,0.45)');
  g.addColorStop(1,'rgba(2,2,5,0.88)');
  recVig=g; return g;
}
function renderRecFrame(now,t){
  drawRecBackdrop(recCtx);
  drawParticles(recCtx,REC_W,REC_H,t);
  recCtx.fillStyle=getRecVignette();
  recCtx.fillRect(0,0,REC_W,REC_H);
  drawBar(recCtx,REC_W,REC_H,now,t);
}

/* ================= PEREKAMAN MP4 (tanpa audio) ================= */
let recording=false, finalizing=false;
let recMode=null, encoder=null, muxer=null, mr=null, mrChunks=[];
let frameIdx=0, recStart=0, recHoldStart=0, lastLblPct=-1;

const CODECS=['avc1.640028','avc1.4d0028','avc1.42001f','avc1.64001f','avc1.640032','avc1.42E01E'];
async function pickCodec(){
  for(const c of CODECS){
    try{
      const s=await VideoEncoder.isConfigSupported({
        codec:c,width:REC_W,height:REC_H,bitrate:REC_BITRATE,framerate:REC_FPS});
      if(s.supported) return c;
    }catch(e){}
  }
  return null;
}
function setBtnState(s,pct){
  dlBtn.classList.toggle('rec',s==='rec');
  dlBtn.disabled=(s==='rec'||s==='proc');
  if(s==='idle')      dlLabel.textContent='Download MP4';
  else if(s==='rec'){ if(pct!==lastLblPct){ dlLabel.textContent='Merekam… '+pct+'%'; lastLblPct=pct; } }
  else if(s==='proc') dlLabel.textContent='Memproses Video…';
  else if(s==='saved')dlLabel.textContent='Tersimpan ✓';
  else if(s==='error')dlLabel.textContent='Gagal — Coba Lagi';
}
function showNote(txt){ dlNote.textContent=txt||''; }
function saveBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

async function startRecording(){
  if(recording||finalizing) return;
  showNote(''); lastLblPct=-1;
  let mode=null;

  /* Jalur utama: WebCodecs + MP4 muxer (video/mp4 asli, tanpa audio) */
  if(typeof VideoEncoder!=='undefined' && typeof Mp4Muxer!=='undefined'){
    const codec=await pickCodec();
    if(codec){
      try{
        muxer=new Mp4Muxer.Muxer({
          target:new Mp4Muxer.ArrayBufferTarget(),
          video:{codec:'avc',width:REC_W,height:REC_H},
          fastStart:'in-memory',
          firstTimestampBehavior:'offset'
        });
        encoder=new VideoEncoder({
          output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),
          error:e=>console.error('Encoder error:',e)
        });
        encoder.configure({codec,width:REC_W,height:REC_H,bitrate:REC_BITRATE,framerate:REC_FPS});
        mode='webcodecs';
      }catch(e){ console.warn(e); mode=null; }
    }
  }
  /* Jalur cadangan: MediaRecorder dari kanvas rekaman */
  if(!mode){
    if(typeof MediaRecorder==='undefined'){ showNote('Browser tidak mendukung perekaman video.'); return; }
    const mimes=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
    const mime=mimes.find(m=>{ try{return MediaRecorder.isTypeSupported(m);}catch(e){return false;} });
    if(!mime){ showNote('Browser tidak mendukung perekaman video.'); return; }
    mrChunks=[];
    mr=new MediaRecorder(recCanvas.captureStream(REC_FPS),{mimeType:mime,videoBitsPerSecond:REC_BITRATE});
    mr.ondataavailable=e=>{ if(e.data&&e.data.size) mrChunks.push(e.data); };
    mr.start(250);
    mode='mr';
    if(!mime.includes('mp4')) showNote('Perangkat tidak mendukung MP4 — disimpan sebagai WebM.');
  }

  recMode=mode;
  recording=true;
  frameIdx=0; recHoldStart=0;
  recStart=performance.now();
  resetRun(recStart);                    // rekam satu siklus penuh 0 → 100%
  setBtnState('rec',0);
}

function pumpRecording(now,t){
  renderRecFrame(now,t);
  if(recMode==='webcodecs' && encoder && encoder.state==='ready'){
    const target=Math.floor((now-recStart)*REC_FPS/1000);
    let guard=0;
    while(frameIdx<=target && guard<4 && encoder.encodeQueueSize<90){
      const ts=Math.round(frameIdx*1e6/REC_FPS);
      const fr=new VideoFrame(recCanvas,{timestamp:ts,duration:Math.round(1e6/REC_FPS)});
      encoder.encode(fr,{keyFrame:frameIdx%(REC_FPS*2)===0});
      fr.close();
      frameIdx++; guard++;
    }
    if(target-frameIdx>45) frameIdx=target;   // lompati gap bila tab sempat terhenti
  }
  /* label persentase perekaman */
  let pct;
  if(!recHoldStart) pct=Math.min(96,Math.round(progress*0.85));
  else pct=Math.min(99,Math.round(85+((now-recHoldStart)/1400)*14));
  setBtnState('rec',pct);

  /* akhir rekaman: tahan 1.4 dtk pada 100% */
  if(progress>=100){
    if(!recHoldStart) recHoldStart=now;
    if(now-recHoldStart>=1400) finishRecording();
  } else if(now-recStart>7500){
    progress=100;
  }
}

async function finishRecording(){
  if(finalizing||!recording) return;
  recording=false; finalizing=true;
  setBtnState('proc');
  try{
    let blob, fname='axion-neuralis-loading';
    if(recMode==='webcodecs'){
      await encoder.flush();
      encoder.close(); encoder=null;
      muxer.finalize();
      blob=new Blob([muxer.target.buffer],{type:'video/mp4'});
      muxer=null; fname+='.mp4';
    }else{
      await new Promise(res=>{ mr.onstop=res; mr.stop(); });
      const mt=mr.mimeType||'video/webm';
      blob=new Blob(mrChunks,{type:mt});
      fname+= mt.includes('mp4') ? '.mp4' : '.webm';
      mr=null;
    }
    saveBlob(blob,fname);
    setBtnState('saved');
  }catch(err){
    console.error(err);
    setBtnState('error');
    showNote('Terjadi kesalahan saat memproses video.');
  }
  finalizing=false;
  setTimeout(()=>setBtnState('idle'),2200);
}

dlBtn.addEventListener('click',startRecording);

/* ================= UKURAN & LOOP UTAMA ================= */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.round(W*DPR);
  canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

let lastT=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-lastT)/1000; lastT=now;
  if(dt>0.06) dt=0.06;
  const t=now/1000;

  sim(now);
  updateParticles(dt,t);

  /* layar */
  ctx.clearRect(0,0,W,H);
  drawParticles(ctx,W,H,t);
  drawBar(ctx,W,H,now,t);

  /* perekaman berjalan di latar */
  if(recording) pumpRecording(now,t);
}

/* init — tunggu font siap agar teks persentase di canvas benar */
Promise.race([
  Promise.all([
    document.fonts.load('600 26px Rajdhani'),
    document.fonts.load('600 14px Rajdhani')
  ]),
  new Promise(r=>setTimeout(r,1500))
]).then(()=>{
  resize();
  buildField();
  window.addEventListener('resize',resize);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) lastT=performance.now(); });
  resetRun(performance.now());
  requestAnimationFrame(frame);
});

})();
</script>
