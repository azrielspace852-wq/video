<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXION Neuralis - Motion Graphic 40 Detik</title>
    <style>
        :root {
            --bg-deep: #030510;
            --cyan-electric: #00e5ff;
            --cyan-glow: #00f0ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-deep);
            overflow: hidden;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        .ui-overlay {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 20;
            pointer-events: none;
        }

        .ui-overlay button {
            pointer-events: auto;
            background: rgba(0, 229, 255, 0.15);
            border: 1px solid rgba(0, 229, 255, 0.6);
            color: #fff;
            padding: 12px 28px;
            font-size: 1rem;
            letter-spacing: 0.2em;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
            margin-bottom: 10px;
        }

        .ui-overlay button:hover {
            background: rgba(0, 229, 255, 0.3);
            box-shadow: 0 0 35px rgba(0, 229, 255, 0.6);
            transform: scale(1.05);
        }

        .ui-overlay button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .progress-container {
            width: 180px;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
            pointer-events: none;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--cyan-electric);
            box-shadow: 0 0 15px var(--cyan-glow), 0 0 45px rgba(0, 229, 255, 0.5);
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        .status-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            pointer-events: none;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            z-index: 100;
            pointer-events: none;
            animation: pulse-loading 1.5s ease-in-out infinite;
        }

        @keyframes pulse-loading {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <div id="loading">AXION NEURALIS</div>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <button id="download-btn" disabled>🔴 RECORD & DOWNLOAD (WEBM)</button>
        <div class="progress-container">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="status-text" id="status-text">■ 0:00 / 0:40</div>
    </div>

    <!-- Three.js dan GSAP dari CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js">
    </script>

    <script>
        (function() {
            // ─── Konfigurasi ───
            const BG_COLOR = 0x030510;
            const CYAN = 0x00e5ff;
            const CYAN_BRIGHT = 0x40f0ff;
            const CYAN_SOFT = 0x40a8c8;
            const WHITE_GLOW = 0xe0ffff;
            const NODE_COUNT = 50;
            const TOTAL_DURATION = 40;

            // ─── Elemen DOM ───
            const container = document.getElementById('canvas-container');
            const progressFill = document.getElementById('progress-fill');
            const statusText = document.getElementById('status-text');
            const downloadBtn = document.getElementById('download-btn');
            const loadingEl = document.getElementById('loading');

            // ─── Renderer & Scene ───
            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: false,
                preserveDrawingBuffer: true,
                powerPreference: 'high-performance'
            });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(BG_COLOR, 1);
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(BG_COLOR);
            scene.fog = new THREE.FogExp2(BG_COLOR, 0.02);

            const camera = new THREE.PerspectiveCamera(
                55,
                container.clientWidth / container.clientHeight,
                0.1,
                100
            );
            camera.position.set(0, 0, 12);
            camera.lookAt(0, 0, 0);

            // ─── Pencahayaan ───
            const ambientLight = new THREE.AmbientLight(0x0a1a2a, 0.8);
            scene.add(ambientLight);

            const pointLightCenter = new THREE.PointLight(CYAN_BRIGHT, 2.0, 30, 1.5);
            pointLightCenter.position.set(0, 0, 0);
            scene.add(pointLightCenter);

            const pointLightSecondary = new THREE.PointLight(0x2080a0, 1.2, 20, 1.8);
            pointLightSecondary.position.set(2, -1, 3);
            scene.add(pointLightSecondary);

            const dirLight = new THREE.DirectionalLight(0x40c0e0, 0.5);
            dirLight.position.set(5, 8, 4);
            scene.add(dirLight);

            // ─── Helper: Buat tekstur cahaya ───
            function createGlowTexture(size, innerColor, outerColor) {
                const canvas = document.createElement('canvas');
                canvas.width = canvas.height = size;
                const ctx = canvas.getContext('2d');
                const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
                gradient.addColorStop(0, innerColor);
                gradient.addColorStop(0.4, innerColor);
                gradient.addColorStop(1, outerColor);
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);
                const tex = new THREE.CanvasTexture(canvas);
                return tex;
            }

            // ─── Helper: Buat teks pada canvas ───
            function createTextSpriteCanvas(text, opts = {}) {
                const {
                    fontSize = 80,
                        fontFamily = "'Segoe UI', 'Helvetica Neue', Arial, sans-serif",
                        color = '#ffffff',
                        glowColor = '#00e5ff',
                        glowBlur = 30,
                        letterSpacing = 6,
                        lineHeight = 1.6,
                        padding = 60,
                        maxWidth = 1200
                } = opts;

                const lines = text.split('\n');
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                ctx.font = `600 ${fontSize}px ${fontFamily}`;
                let maxLineWidth = 0;
                for (const line of lines) {
                    const w = ctx.measureText(line).width + (line.length - 1) * letterSpacing;
                    if (w > maxLineWidth) maxLineWidth = w;
                }
                const totalWidth = Math.min(maxLineWidth + padding * 2, maxWidth);
                const lineHeightPx = fontSize * lineHeight;
                const totalHeight = lines.length * lineHeightPx + padding * 2;
                canvas.width = Math.ceil(totalWidth);
                canvas.height = Math.ceil(totalHeight);

                const c2 = canvas.getContext('2d');
                c2.clearRect(0, 0, canvas.width, canvas.height);
                c2.font = `600 ${fontSize}px ${fontFamily}`;
                c2.textAlign = 'center';
                c2.textBaseline = 'middle';
                c2.letterSpacing = `${letterSpacing}px`;
                const centerX = canvas.width / 2;
                for (let i = 0; i < lines.length; i++) {
                    const y = padding + i * lineHeightPx + lineHeightPx / 2;
                    c2.shadowColor = glowColor;
                    c2.shadowBlur = glowBlur;
                    c2.fillStyle = color;
                    c2.fillText(lines[i], centerX, y);
                    c2.shadowBlur = glowBlur * 1.5;
                    c2.fillText(lines[i], centerX, y);
                }
                const tex = new THREE.CanvasTexture(canvas);
                tex.minFilter = THREE.LinearFilter;
                tex.magFilter = THREE.LinearFilter;
                return { texture: tex, aspect: canvas.width / canvas.height };
            }

            // ─── Helper: Buat logo 'A' ───
            function createLogoSpriteCanvas(letter = 'A', opts = {}) {
                const {
                    fontSize = 380,
                        fontFamily = "'Segoe UI', 'Helvetica Neue', Arial, sans-serif",
                        color = '#ffffff',
                        glowColor = '#00e5ff',
                        glowBlur = 50
                } = opts;

                const canvas = document.createElement('canvas');
                canvas.width = canvas.height = 700;
                const c2 = canvas.getContext('2d');
                c2.clearRect(0, 0, canvas.width, canvas.height);
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const size = fontSize;
                const halfSize = size / 2;
                c2.shadowColor = glowColor;
                c2.shadowBlur = glowBlur;
                c2.strokeStyle = color;
                c2.lineWidth = 8;
                c2.lineCap = 'round';
                c2.lineJoin = 'round';
                const topY = centerY - halfSize * 0.75;
                const bottomY = centerY + halfSize * 0.8;
                const leftX = centerX - halfSize * 0.65;
                const rightX = centerX + halfSize * 0.65;
                c2.beginPath();
                c2.moveTo(leftX, bottomY);
                c2.lineTo(centerX, topY);
                c2.lineTo(rightX, bottomY);
                c2.stroke();
                c2.beginPath();
                c2.moveTo(leftX + halfSize * 0.4, centerY + halfSize * 0.25);
                c2.lineTo(rightX - halfSize * 0.4, centerY + halfSize * 0.25);
                c2.stroke();
                c2.shadowBlur = glowBlur * 2;
                c2.beginPath();
                c2.moveTo(leftX, bottomY);
                c2.lineTo(centerX, topY);
                c2.lineTo(rightX, bottomY);
                c2.stroke();
                c2.beginPath();
                c2.moveTo(leftX + halfSize * 0.4, centerY + halfSize * 0.25);
                c2.lineTo(rightX - halfSize * 0.4, centerY + halfSize * 0.25);
                c2.stroke();
                const tex = new THREE.CanvasTexture(canvas);
                tex.minFilter = THREE.LinearFilter;
                tex.magFilter = THREE.LinearFilter;
                return { texture: tex, aspect: 1 };
            }

            // ─── Fase 1: Partikel Tunggal ───
            const singleParticleGeo = new THREE.SphereGeometry(0.2, 32, 32);
            const singleParticleMat = new THREE.MeshBasicMaterial({ color: WHITE_GLOW });
            const singleParticle = new THREE.Mesh(singleParticleGeo, singleParticleMat);
            singleParticle.visible = true;
            scene.add(singleParticle);

            const particleGlowTexture = createGlowTexture(256, '#ffffff', 'rgba(0,180,255,0)');
            const particleGlowMat = new THREE.SpriteMaterial({
                map: particleGlowTexture,
                color: 0x00ccff,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.9
            });
            const particleGlowSprite = new THREE.Sprite(particleGlowMat);
            particleGlowSprite.scale.set(3.0, 3.0, 1);
            particleGlowSprite.visible = true;
            scene.add(particleGlowSprite);

            // ─── Fase 2: Jaringan Neural ───
            const nodeGroup = new THREE.Group();
            nodeGroup.visible = false;
            scene.add(nodeGroup);

            const nodeGeometry = new THREE.SphereGeometry(0.08, 10, 10);
            const nodeMaterial = new THREE.MeshBasicMaterial({ color: CYAN_BRIGHT });
            const nodeInstancedMesh = new THREE.InstancedMesh(nodeGeometry, nodeMaterial, NODE_COUNT);
            nodeInstancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            nodeGroup.add(nodeInstancedMesh);

            const nodeGlowTexture = createGlowTexture(64, '#ffffff', 'rgba(0,200,255,0)');
            const nodeGlowMaterial = new THREE.SpriteMaterial({
                map: nodeGlowTexture,
                color: 0x00ccff,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.6
            });
            const nodeGlowSprites = [];
            for (let i = 0; i < NODE_COUNT; i++) {
                const sprite = new THREE.Sprite(nodeGlowMaterial.clone());
                sprite.scale.set(0.7, 0.7, 1);
                sprite.visible = false;
                nodeGroup.add(sprite);
                nodeGlowSprites.push(sprite);
            }

            // Posisi jaringan acak
            const nodeNetworkPositions = [];
            const nodeSpherePositions = [];
            const nodeCurrentPositions = [];
            const sphereRadius = 2.6;

            for (let i = 0; i < NODE_COUNT; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 2.2 + Math.random() * 3.2;
                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.sin(phi) * Math.sin(theta) * 0.75;
                const z = r * Math.cos(phi);
                nodeNetworkPositions.push(new THREE.Vector3(x, y, z));
                nodeCurrentPositions.push(new THREE.Vector3(x, y, z));
            }

            const goldenRatio = (1 + Math.sqrt(5)) / 2;
            for (let i = 0; i < NODE_COUNT; i++) {
                const theta = 2 * Math.PI * i / goldenRatio;
                const phi = Math.acos(1 - 2 * (i + 0.5) / NODE_COUNT);
                const x = sphereRadius * Math.sin(phi) * Math.cos(theta);
                const y = sphereRadius * Math.sin(phi) * Math.sin(theta) * 0.85;
                const z = sphereRadius * Math.cos(phi);
                nodeSpherePositions.push(new THREE.Vector3(x, y, z));
            }

            // Simpan posisi asli untuk reset
            const originalNetworkPositions = nodeNetworkPositions.map(p => p.clone());

            // Garis penghubung
            const edgePairs = [];
            const edgePositions = [];
            const EDGE_THRESHOLD = 3.5;
            for (let i = 0; i < NODE_COUNT; i++) {
                for (let j = i + 1; j < NODE_COUNT; j++) {
                    const p1 = nodeNetworkPositions[i];
                    const p2 = nodeNetworkPositions[j];
                    if (p1.distanceTo(p2) < EDGE_THRESHOLD) {
                        edgePairs.push([i, j]);
                        edgePositions.push(p1.x, p1.y, p1.z, p2.x, p2.y, p2.z);
                    }
                }
            }

            const edgeGeometry = new THREE.BufferGeometry();
            edgeGeometry.setAttribute('position', new THREE.Float32BufferAttribute(edgePositions, 3));
            const edgeMaterial = new THREE.LineBasicMaterial({
                color: CYAN,
                transparent: true,
                opacity: 0.35,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const edgeLines = new THREE.LineSegments(edgeGeometry, edgeMaterial);
            edgeLines.visible = false;
            nodeGroup.add(edgeLines);

            // ─── Fase 3: Bola Kaca ───
            const glassSphereGeo = new THREE.SphereGeometry(sphereRadius, 64, 64);
            const glassSphereMat = new THREE.MeshPhongMaterial({
                color: 0x88ccdd,
                transparent: true,
                opacity: 0.2,
                shininess: 60,
                side: THREE.DoubleSide,
                depthWrite: false
            });
            const glassSphere = new THREE.Mesh(glassSphereGeo, glassSphereMat);
            glassSphere.visible = false;
            glassSphere.scale.set(0.001, 0.001, 0.001);
            scene.add(glassSphere);

            const innerGlowGeo = new THREE.SphereGeometry(sphereRadius * 0.9, 32, 32);
            const innerGlowMat = new THREE.MeshBasicMaterial({
                color: 0x003040,
                transparent: true,
                opacity: 0.2,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const innerGlowSphere = new THREE.Mesh(innerGlowGeo, innerGlowMat);
            innerGlowSphere.visible = false;
            innerGlowSphere.scale.set(0.001, 0.001, 0.001);
            scene.add(innerGlowSphere);

            const wireframeGeo = new THREE.SphereGeometry(sphereRadius * 1.01, 24, 18);
            const wireframeMat = new THREE.MeshBasicMaterial({
                color: CYAN_SOFT,
                wireframe: true,
                transparent: true,
                opacity: 0.12,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const wireframeSphere = new THREE.Mesh(wireframeGeo, wireframeMat);
            wireframeSphere.visible = false;
            wireframeSphere.scale.set(0.001, 0.001, 0.001);
            scene.add(wireframeSphere);

            // ─── Fase 4: Teks di Ruang 3D ───
            const textSpriteGroup = new THREE.Group();
            textSpriteGroup.visible = false;
            scene.add(textSpriteGroup);

            const ecosystemTextData = createTextSpriteCanvas('AI. Software.\nEcosystem.', {
                fontSize: 80,
                glowBlur: 30,
                letterSpacing: 8,
                lineHeight: 1.8,
                padding: 50,
                maxWidth: 900
            });
            const ecosystemTextMat = new THREE.SpriteMaterial({
                map: ecosystemTextData.texture,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                opacity: 0
            });
            const ecosystemTextSprite = new THREE.Sprite(ecosystemTextMat);
            const textScale = 6.0;
            ecosystemTextSprite.scale.set(textScale, textScale / ecosystemTextData.aspect, 1);
            ecosystemTextSprite.position.set(0, 0.6, 0.5);
            textSpriteGroup.add(ecosystemTextSprite);

            const textParticlesGeo = new THREE.BufferGeometry();
            const textParticleCount = 30;
            const textParticlePositions = new Float32Array(textParticleCount * 3);
            for (let i = 0; i < textParticleCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 1.5 + Math.random() * 2.5;
                textParticlePositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                textParticlePositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) * 0.6;
                textParticlePositions[i * 3 + 2] = r * Math.cos(phi);
            }
            textParticlesGeo.setAttribute('position', new THREE.BufferAttribute(textParticlePositions, 3));
            const textParticlesMat = new THREE.PointsMaterial({
                color: CYAN_BRIGHT,
                size: 0.04,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const textParticles = new THREE.Points(textParticlesGeo, textParticlesMat);
            textParticles.visible = false;
            textSpriteGroup.add(textParticles);

            // ─── Fase 5: Logo 'A' dan Nama Perusahaan ───
            const logoGroup = new THREE.Group();
            logoGroup.visible = false;
            scene.add(logoGroup);

            const logoAData = createLogoSpriteCanvas('A', { fontSize: 380, glowBlur: 45 });
            const logoAMat = new THREE.SpriteMaterial({
                map: logoAData.texture,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                opacity: 0
            });
            const logoASprite = new THREE.Sprite(logoAMat);
            const logoScale = 4.5;
            logoASprite.scale.set(logoScale, logoScale, 1);
            logoASprite.position.set(0, 0.8, 0);
            logoGroup.add(logoASprite);

            const companyTextData = createTextSpriteCanvas('AXION NEURALIS', {
                fontSize: 64,
                glowBlur: 28,
                letterSpacing: 14,
                padding: 35,
                maxWidth: 800
            });
            const companyTextMat = new THREE.SpriteMaterial({
                map: companyTextData.texture,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                opacity: 0
            });
            const companyTextSprite = new THREE.Sprite(companyTextMat);
            const companyScale = 4.0;
            companyTextSprite.scale.set(companyScale, companyScale / companyTextData.aspect, 1);
            companyTextSprite.position.set(0, -1.6, 0);
            logoGroup.add(companyTextSprite);

            const logoParticlesGeo = new THREE.BufferGeometry();
            const logoParticleCount = 50;
            const logoParticlePositions = new Float32Array(logoParticleCount * 3);
            for (let i = 0; i < logoParticleCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 1.0 + Math.random() * 3.5;
                logoParticlePositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                logoParticlePositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) * 0.7 + 0.3;
                logoParticlePositions[i * 3 + 2] = r * Math.cos(phi);
            }
            logoParticlesGeo.setAttribute('position', new THREE.BufferAttribute(logoParticlePositions, 3));
            const logoParticlesMat = new THREE.PointsMaterial({
                color: CYAN_BRIGHT,
                size: 0.045,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const logoParticles = new THREE.Points(logoParticlesGeo, logoParticlesMat);
            logoParticles.visible = false;
            logoGroup.add(logoParticles);

            // ─── Variabel state ───
            let nodeInterpolationProgress = 0;
            let networkRotation = 0;
            let networkGroupRotationSpeed = 0.4;
            let globalTime = 0;
            let isRecording = false;
            let mediaRecorder = null;
            let recordedChunks = [];

            // ─── Perbarui posisi node dan garis ───
            function updateNodeInstances() {
                const dummy = new THREE.Object3D();
                for (let i = 0; i < NODE_COUNT; i++) {
                    const start = nodeNetworkPositions[i];
                    const end = nodeSpherePositions[i];
                    const current = nodeCurrentPositions[i];
                    current.lerpVectors(start, end, nodeInterpolationProgress);
                    dummy.position.copy(current);
                    dummy.updateMatrix();
                    nodeInstancedMesh.setMatrixAt(i, dummy.matrix);
                    if (nodeGlowSprites[i]) {
                        nodeGlowSprites[i].position.copy(current);
                        nodeGlowSprites[i].visible = nodeGroup.visible && nodeInterpolationProgress < 0.95;
                    }
                }
                nodeInstancedMesh.instanceMatrix.needsUpdate = true;

                const edgePosArray = edgeGeometry.attributes.position.array;
                for (let e = 0; e < edgePairs.length; e++) {
                    const [i, j] = edgePairs[e];
                    const pi = nodeCurrentPositions[i];
                    const pj = nodeCurrentPositions[j];
                    const idx = e * 6;
                    edgePosArray[idx] = pi.x;
                    edgePosArray[idx + 1] = pi.y;
                    edgePosArray[idx + 2] = pi.z;
                    edgePosArray[idx + 3] = pj.x;
                    edgePosArray[idx + 4] = pj.y;
                    edgePosArray[idx + 5] = pj.z;
                }
                edgeGeometry.attributes.position.needsUpdate = true;
                edgeGeometry.computeBoundingSphere();
            }

            // ─── Bangun timeline GSAP ───
            const masterTimeline = gsap.timeline({ paused: false });

            // Fase 1: 0-5 detik
            masterTimeline.set(singleParticle, { visible: true, scale: 0.1 }, 0);
            masterTimeline.set(particleGlowSprite, { visible: true, opacity: 0.9 }, 0);
            masterTimeline.to(singleParticle.scale, { x: 1.6, y: 1.6, z: 1.6, duration: 2.8, ease: 'power2.out' }, 0);
            masterTimeline.to(particleGlowSprite.scale, { x: 5.0, y: 5.0, duration: 2.8, ease: 'power2.out' }, 0);
            masterTimeline.to(pointLightCenter, { intensity: 3.5, duration: 2.5, ease: 'sine.inOut' }, 0);
            masterTimeline.to(singleParticle.scale, {
                x: 1.9, y: 1.9, z: 1.9, duration: 0.5, yoyo: true, repeat: 3, ease: 'sine.inOut'
            }, 2.5);

            // Fase 2: 5-15 detik
            masterTimeline.addLabel('network', 5);
            masterTimeline.to(singleParticle, { visible: false, duration: 0.01 }, 5);
            masterTimeline.to(singleParticle.scale, { x: 0.05, y: 0.05, z: 0.05, duration: 1.5, ease: 'power2.in' }, 5);
            masterTimeline.to(particleGlowSprite, {
                opacity: 0, duration: 1.2, ease: 'power2.in',
                onComplete: () => { particleGlowSprite.visible = false; }
            }, 5);
            masterTimeline.to(particleGlowSprite.scale, { x: 1.2, y: 1.2, duration: 1.2, ease: 'power2.in' }, 5);

            masterTimeline.set(nodeGroup, { visible: true }, 5.2);
            masterTimeline.set(edgeLines, { visible: true }, 5.2);
            masterTimeline.fromTo(nodeInstancedMesh, { scale: 0.001 }, { scale: 1, duration: 2.5, ease: 'elastic.out(1, 0.6)' },
                5.2);

            // Sebarkan node dari pusat
            const spreadProxy = { progress: 0 };
            masterTimeline.to(spreadProxy, {
                progress: 1,
                duration: 4.5,
                ease: 'power2.out',
                onUpdate: () => {
                    for (let i = 0; i < NODE_COUNT; i++) {
                        nodeNetworkPositions[i].lerpVectors(
                            new THREE.Vector3(0, 0, 0),
                            originalNetworkPositions[i],
                            spreadProxy.progress
                        );
                    }
                    updateNodeInstances();
                },
            }, 5.5);

            masterTimeline.fromTo(edgeMaterial, { opacity: 0 }, { opacity: 0.35, duration: 2.0, ease: 'sine.inOut' },
            6.5);
            masterTimeline.to(nodeGlowMaterial, { opacity: 0.6, duration: 1.5, ease: 'sine.inOut' }, 6.5);
            masterTimeline.to(camera.position, {
                z: 7.5, duration: 8.5, ease: 'power2.inOut',
                onUpdate: () => camera.lookAt(0, 0, 0)
            }, 5.5);
            masterTimeline.to(camera.position, {
                y: 0.5, duration: 8.5, ease: 'sine.inOut',
                onUpdate: () => camera.lookAt(0, 0, 0)
            }, 5.5);

            // Fase 3: 15-25 detik
            masterTimeline.addLabel('sphere', 15);
            const sphereProxy = { progress: 0 };
            masterTimeline.to(sphereProxy, {
                progress: 1,
                duration: 5.5,
                ease: 'power2.inOut',
                onUpdate: () => {
                    nodeInterpolationProgress = sphereProxy.progress;
                    updateNodeInstances();
                },
            }, 15);
            masterTimeline.to(edgeMaterial, { opacity: 0.08, duration: 3.0, ease: 'sine.inOut' }, 16);

            masterTimeline.set(glassSphere, { visible: true }, 16.5);
            masterTimeline.to(glassSphere.scale, { x: 1, y: 1, z: 1, duration: 3.5, ease: 'power2.out' }, 16.5);
            masterTimeline.set(innerGlowSphere, { visible: true }, 16.8);
            masterTimeline.to(innerGlowSphere.scale, { x: 1, y: 1, z: 1, duration: 3.2, ease: 'power2.out' }, 16.8);
            masterTimeline.set(wireframeSphere, { visible: true }, 17.0);
            masterTimeline.to(wireframeSphere.scale, { x: 1, y: 1, z: 1, duration: 3.0, ease: 'power2.out' }, 17.0);
            masterTimeline.to(glassSphere.rotation, { y: Math.PI * 2, duration: 8, ease: 'none' }, 16.5);
            masterTimeline.to(wireframeSphere.rotation, { y: Math.PI * 2.5, duration: 8, ease: 'none' }, 17);
            masterTimeline.to(camera.position, {
                z: 8.5, duration: 4, ease: 'power2.inOut',
                onUpdate: () => camera.lookAt(0, 0, 0)
            }, 17);

            // Fase 4: 25-35 detik
            masterTimeline.addLabel('text', 25);
            masterTimeline.to(glassSphere.scale, { x: 1.15, y: 1.15, z: 1.15, duration: 2.5, ease: 'power2.out' }, 25);
            masterTimeline.to(glassSphereMat, { opacity: 0.12, duration: 2.5, ease: 'sine.inOut' }, 25);
            masterTimeline.to(wireframeSphere.scale, { x: 1.25, y: 1.25, z: 1.25, duration: 2.5, ease: 'power2.out' },
                25);
            masterTimeline.to(wireframeMat, { opacity: 0.25, duration: 2.0, ease: 'sine.inOut' }, 25.5);

            masterTimeline.set(textSpriteGroup, { visible: true }, 26.5);
            masterTimeline.set(textParticles, { visible: true }, 26.5);
            masterTimeline.to(ecosystemTextMat, { opacity: 1, duration: 2.0, ease: 'power2.out' }, 26.5);
            masterTimeline.fromTo(ecosystemTextSprite.scale, {
                x: textScale * 0.5, y: (textScale / ecosystemTextData.aspect) * 0.5
            }, {
                x: textScale, y: textScale / ecosystemTextData.aspect, duration: 2.2, ease: 'elastic.out(1, 0.5)'
            }, 26.5);
            masterTimeline.to(textParticlesMat, { opacity: 0.7, duration: 1.8, ease: 'sine.inOut' }, 27);
            masterTimeline.to(textParticles.rotation, { y: Math.PI * 0.6, duration: 8, ease: 'none' }, 26.5);
            masterTimeline.to(textParticles.rotation, { x: Math.PI * 0.2, duration: 8, ease: 'none' }, 26.5);
            masterTimeline.to(camera.position, {
                z: 9.0, duration: 3, ease: 'power2.inOut',
                onUpdate: () => camera.lookAt(0, 0.2, 0)
            }, 26);
            masterTimeline.to(wireframeMat, { opacity: 0.08, duration: 2.5, ease: 'sine.inOut' }, 28);

            // Fase 5: 35-40 detik
            masterTimeline.addLabel('logo', 35);
            masterTimeline.to(ecosystemTextMat, { opacity: 0, duration: 1.5, ease: 'power2.in' }, 35);
            masterTimeline.to(textParticlesMat, { opacity: 0, duration: 1.5, ease: 'power2.in' }, 35);
            masterTimeline.to(glassSphereMat, { opacity: 0.05, duration: 2.0, ease: 'sine.inOut' }, 35);
            masterTimeline.to(wireframeMat, { opacity: 0.03, duration: 2.0, ease: 'sine.inOut' }, 35);
            masterTimeline.set(textSpriteGroup, { visible: false }, 37);
            masterTimeline.set(textParticles, { visible: false }, 37);

            const finalProxy = { progress: 0 };
            masterTimeline.to(finalProxy, {
                progress: 1,
                duration: 3.5,
                ease: 'power2.inOut',
                onUpdate: () => {
                    const p = finalProxy.progress;
                    for (let i = 0; i < NODE_COUNT; i++) {
                        nodeCurrentPositions[i].multiplyScalar(1 - p * 0.75);
                    }
                    updateNodeInstances();
                },
            }, 35.5);

            masterTimeline.to(glassSphere.scale, { x: 0.001, y: 0.001, z: 0.001, duration: 2.5, ease: 'power2.in' },
                36);
            masterTimeline.to(innerGlowSphere.scale, { x: 0.001, y: 0.001, z: 0.001, duration: 2.5, ease: 'power2.in' },
                36);
            masterTimeline.to(wireframeSphere.scale, { x: 0.001, y: 0.001, z: 0.001, duration: 2.5, ease: 'power2.in' },
                36);
            masterTimeline.set(glassSphere, { visible: false }, 38.5);
            masterTimeline.set(innerGlowSphere, { visible: false }, 38.5);
            masterTimeline.set(wireframeSphere, { visible: false }, 38.5);

            masterTimeline.set(logoGroup, { visible: true }, 37.5);
            masterTimeline.set(logoParticles, { visible: true }, 37.5);
            masterTimeline.to(logoAMat, { opacity: 1, duration: 1.8, ease: 'power2.out' }, 37.5);
            masterTimeline.fromTo(logoASprite.scale, { x: logoScale * 0.3, y: logoScale * 0.3 }, {
                x: logoScale, y: logoScale, duration: 2.0, ease: 'elastic.out(1, 0.45)'
            }, 37.5);
            masterTimeline.to(companyTextMat, { opacity: 1, duration: 1.5, ease: 'power2.out' }, 38);
            masterTimeline.fromTo(companyTextSprite.scale, {
                x: companyScale * 0.4, y: (companyScale / companyTextData.aspect) * 0.4
            }, {
                x: companyScale, y: companyScale / companyTextData.aspect, duration: 1.8, ease: 'power2.out'
            }, 38);
            masterTimeline.to(logoParticlesMat, { opacity: 0.5, duration: 1.5, ease: 'sine.inOut' }, 38);
            masterTimeline.to(logoParticles.rotation, { y: Math.PI * 1.2, duration: 3, ease: 'none' }, 37.5);
            masterTimeline.to(camera.position, {
                z: 10, y: 0, duration: 3.5, ease: 'power2.inOut',
                onUpdate: () => camera.lookAt(0, 0, 0)
            }, 36);
            masterTimeline.to(pointLightCenter, { intensity: 5.0, duration: 1.2, yoyo: true, repeat: 1, ease: 'sine.inOut' },
                38);

            // ─── Loop render ───
            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();
                globalTime += delta;

                if (nodeGroup.visible && globalTime > 5 && globalTime < 25) {
                    networkRotation += delta * networkGroupRotationSpeed;
                    nodeGroup.rotation.y = networkRotation;
                    nodeGroup.rotation.x = Math.sin(networkRotation * 0.3) * 0.08;
                } else if (logoGroup.visible) {
                    logoGroup.rotation.y += delta * 0.15;
                    logoGroup.rotation.x += delta * 0.04;
                }

                if (globalTime > 5 && globalTime < 35) {
                    camera.position.x = Math.sin(globalTime * 0.4) * 0.08;
                    camera.position.y += Math.cos(globalTime * 0.3) * 0.005;
                    camera.lookAt(0, 0, 0);
                }

                // Update progress bar
                const progress = Math.min(globalTime / TOTAL_DURATION, 1);
                progressFill.style.width = `${progress * 100}%`;
                const secs = Math.floor(globalTime);
                const mins = Math.floor(secs / 60);
                const remSecs = secs % 60;
                statusText.textContent = `■ ${mins}:${remSecs.toString().padStart(2, '0')} / 0:40`;

                if (progress > 0.02) {
                    loadingEl.style.display = 'none';
                }

                renderer.render(scene, camera);
            }

            // ─── Responsif ───
            window.addEventListener('resize', () => {
                const w = container.clientWidth;
                const h = container.clientHeight;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            });

            // ─── Keyboard shortcuts ───
            window.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    if (masterTimeline.paused()) masterTimeline.play();
                    else masterTimeline.pause();
                }
                if (e.key === 'r' || e.key === 'R') {
                    e.preventDefault();
                    masterTimeline.restart();
                    globalTime = 0;
                    nodeInterpolationProgress = 0;
                    networkRotation = 0;
                    for (let i = 0; i < NODE_COUNT; i++) {
                        nodeNetworkPositions[i].copy(originalNetworkPositions[i]);
                        nodeCurrentPositions[i].copy(originalNetworkPositions[i]);
                    }
                    updateNodeInstances();
                    progressFill.style.width = '0%';
                    loadingEl.style.display = 'block';
                }
                if (e.key === 'f' || e.key === 'F') {
                    e.preventDefault();
                    if (!document.fullscreenElement) document.body.requestFullscreen().catch(() => {});
                    else document.exitFullscreen().catch(() => {});
                }
            });

            // ─── Perekaman video ───
            downloadBtn.disabled = false;

            function startRecording() {
                if (isRecording) return;
                const canvas = renderer.domElement;
                if (!canvas.captureStream) {
                    alert('Browser tidak mendukung captureStream. Gunakan Chrome atau Edge terbaru.');
                    return;
                }
                const stream = canvas.captureStream(60);
                const mimeType = 'video/webm;codecs=vp9';
                if (!window.MediaRecorder || !MediaRecorder.isTypeSupported(mimeType)) {
                    alert('Browser tidak mendukung perekaman WebM VP9. Coba gunakan Chrome terbaru.');
                    return;
                }
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8000000 });
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'AXION_Neuralis_MotionGraphic.webm';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    isRecording = false;
                    downloadBtn.textContent = '🔴 RECORD & DOWNLOAD (WEBM)';
                    downloadBtn.disabled = false;
                };
                mediaRecorder.start();
                isRecording = true;
                downloadBtn.textContent = '⏺ RECORDING... (40 detik)';
                downloadBtn.disabled = true;
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                        mediaRecorder.stop();
                    }
                }, TOTAL_DURATION * 1000 + 500);
            }

            downloadBtn.addEventListener('click', () => {
                if (!isRecording) {
                    masterTimeline.restart();
                    globalTime = 0;
                    for (let i = 0; i < NODE_COUNT; i++) {
                        nodeNetworkPositions[i].copy(originalNetworkPositions[i]);
                        nodeCurrentPositions[i].copy(originalNetworkPositions[i]);
                    }
                    updateNodeInstances();
                    startRecording();
                }
            });

            // ─── Mulai animasi ───
            console.log('AXION Neuralis motion graphic dimulai.');
            animate();
            masterTimeline.play();
        })();
    </script>
</body>
 </html>
