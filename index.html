<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romance Engine — Loading Screen Generator</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050409;
            color: #e0d8e8;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .header {
            text-align: center;
            padding: 16px 0;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #a08cb8;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.8rem;
            color: #6a5a7a;
            letter-spacing: 0.05em;
        }

        .canvas-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow:
                0 0 60px rgba(233, 30, 99, 0.08),
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 0 0 1px rgba(233, 30, 99, 0.1);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }

        .btn {
            width: 100%;
            padding: 16px 32px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #E91E63, #9C27B0);
            color: #fff;
            box-shadow: 0 4px 20px rgba(233, 30, 99, 0.3);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(233, 30, 99, 0.5);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn.recording {
            background: linear-gradient(135deg, #4A148C, #1A237E);
            box-shadow: 0 4px 20px rgba(74, 20, 140, 0.4);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .progress-bar.active {
            opacity: 1;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #E91E63, #FF4081);
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .status-text {
            font-size: 0.8rem;
            color: #6a5a7a;
            text-align: center;
            min-height: 1.2em;
        }

        .footer {
            margin-top: 16px;
            font-size: 0.7rem;
            color: #3a2f48;
            text-align: center;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.1rem;
            }
            .btn {
                padding: 14px 24px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Romance Engine</h1>
            <p>Loading Screen Generator — Client-Side MP4 Export</p>
        </div>

        <div class="canvas-wrapper">
            <canvas id="canvas" width="1920" height="1080"></canvas>
        </div>

        <div class="controls">
            <button class="btn" id="downloadBtn">Download MP4 (No Audio)</button>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="status-text" id="statusText"></div>
        </div>

        <div class="footer">
            1920×1080 @ 60FPS · 5 seconds · WebCodecs + mp4-muxer · Chrome only
        </div>
    </div>

    <script type="module">
        import { Muxer, ArrayBufferTarget } from 'https://esm.sh/mp4-muxer@5';

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');

        const WIDTH = 1920;
        const HEIGHT = 1080;
        const FPS = 60;
        const DURATION = 5;
        const TOTAL_FRAMES = FPS * DURATION;

        // Status messages
        const messages = [
            "Loading Stories...",
            "Connecting Hearts...",
            "Preparing Scene...",
            "Weaving Narratives...",
            "Opening Portals...",
            "Synchronizing Souls..."
        ];

        // Particle system
        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * WIDTH;
                this.y = HEIGHT + Math.random() * 200;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * 0.8 + 0.3;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.hue = Math.random() > 0.5 ? 340 : 280;
                this.pulse = Math.random() * Math.PI * 2;
                this.pulseSpeed = Math.random() * 2 + 1;
            }
            update(dt) {
                this.y -= this.speedY * dt * 60;
                this.x += this.speedX * dt * 60;
                this.pulse += this.pulseSpeed * dt;
                if (this.y < -20) this.reset();
            }
            draw(ctx, time) {
                const glow = Math.sin(this.pulse) * 0.3 + 0.7;
                const alpha = this.opacity * glow;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = `hsl(${this.hue}, 80%, 70%)`;
                ctx.shadowColor = `hsl(${this.hue}, 80%, 60%)`;
                ctx.shadowBlur = this.size * 4;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const particles = Array.from({ length: 80 }, () => new Particle());

        // Animation state
        let animTime = 0;
        let lastTimestamp = 0;

        function drawBackground() {
            // Main gradient
            const grad = ctx.createRadialGradient(WIDTH / 2, HEIGHT / 2, 0, WIDTH / 2, HEIGHT / 2, WIDTH * 0.7);
            grad.addColorStop(0, '#1A0B2E');
            grad.addColorStop(0.5, '#110820');
            grad.addColorStop(1, '#0D0B18');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // Subtle vignette overlay
            const vignette = ctx.createRadialGradient(WIDTH / 2, HEIGHT / 2, WIDTH * 0.2, WIDTH / 2, HEIGHT / 2, WIDTH * 0.8);
            vignette.addColorStop(0, 'rgba(0,0,0,0)');
            vignette.addColorStop(1, 'rgba(0,0,0,0.5)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
        }

        function drawTitle(time) {
            const centerX = WIDTH / 2;
            const titleY = HEIGHT * 0.28;

            // Glow layers
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 84px "Segoe UI", sans-serif';
            ctx.letterSpacing = '8px';

            // Outer glow
            ctx.shadowColor = '#E91E63';
            ctx.shadowBlur = 60 + Math.sin(time * 2) * 15;
            ctx.fillStyle = 'rgba(233, 30, 99, 0.3)';
            ctx.fillText('ROMANCE ENGINE', centerX, titleY);

            // Mid glow
            ctx.shadowBlur = 30;
            ctx.fillStyle = 'rgba(255, 64, 129, 0.6)';
            ctx.fillText('ROMANCE ENGINE', centerX, titleY);

            // Core text
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#FF4081';
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText('ROMANCE ENGINE', centerX, titleY);

            ctx.restore();

            // Subtitle line
            ctx.save();
            const lineY = titleY + 60;
            const lineWidth = 300;
            const lineGrad = ctx.createLinearGradient(centerX - lineWidth / 2, lineY, centerX + lineWidth / 2, lineY);
            lineGrad.addColorStop(0, 'rgba(233, 30, 99, 0)');
            lineGrad.addColorStop(0.2, 'rgba(233, 30, 99, 0.6)');
            lineGrad.addColorStop(0.5, 'rgba(255, 64, 129, 0.9)');
            lineGrad.addColorStop(0.8, 'rgba(233, 30, 99, 0.6)');
            lineGrad.addColorStop(1, 'rgba(233, 30, 99, 0)');
            ctx.strokeStyle = lineGrad;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(centerX - lineWidth / 2, lineY);
            ctx.lineTo(centerX + lineWidth / 2, lineY);
            ctx.stroke();
            ctx.restore();
        }

        function drawRingLoader(time) {
            const centerX = WIDTH / 2;
            const centerY = HEIGHT * 0.55;
            const baseRadius = 100;

            // Heartbeat pulse
            const heartbeat = Math.pow(Math.sin(time * 3), 16) * 15;

            // Outer ring - rotating dashes
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(time * 0.5);
            ctx.strokeStyle = 'rgba(233, 30, 99, 0.3)';
            ctx.lineWidth = 2;
            ctx.setLineDash([20, 15]);
            ctx.beginPath();
            ctx.arc(0, 0, baseRadius + 40 + heartbeat * 0.3, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();

            // Middle ring - wave distortion
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(-time * 0.8);
            const segments = 120;
            ctx.beginPath();
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                const wave = Math.sin(angle * 6 + time * 4) * 5;
                const r = baseRadius + 15 + wave + heartbeat * 0.5;
                const x = Math.cos(angle) * r;
                const y = Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.strokeStyle = 'rgba(156, 39, 176, 0.5)';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = '#9C27B0';
            ctx.shadowBlur = 15;
            ctx.stroke();
            ctx.restore();

            // Inner ring - main loader arc
            ctx.save();
            ctx.translate(centerX, centerY);
            const arcStart = time * 2;
            const arcLength = Math.PI * 1.2 + Math.sin(time * 3) * 0.5;

            ctx.beginPath();
            ctx.arc(0, 0, baseRadius + heartbeat * 0.7, arcStart, arcStart + arcLength);
            ctx.strokeStyle = '#E91E63';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.shadowColor = '#FF4081';
            ctx.shadowBlur = 25 + Math.sin(time * 4) * 10;
            ctx.stroke();

            // Second arc (opposite direction)
            ctx.beginPath();
            ctx.arc(0, 0, baseRadius + heartbeat * 0.7 - 10, -arcStart * 1.3, -arcStart * 1.3 + Math.PI * 0.8);
            ctx.strokeStyle = '#FF4081';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 20;
            ctx.stroke();
            ctx.restore();

            // Center glow orb
            ctx.save();
            ctx.translate(centerX, centerY);
            const orbSize = 8 + heartbeat * 0.3 + Math.sin(time * 5) * 2;
            const orbGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, orbSize * 3);
            orbGrad.addColorStop(0, 'rgba(255, 64, 129, 0.9)');
            orbGrad.addColorStop(0.3, 'rgba(233, 30, 99, 0.4)');
            orbGrad.addColorStop(1, 'rgba(233, 30, 99, 0)');
            ctx.fillStyle = orbGrad;
            ctx.beginPath();
            ctx.arc(0, 0, orbSize * 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FFFFFF';
            ctx.shadowColor = '#FF4081';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(0, 0, orbSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Orbiting dots
            ctx.save();
            ctx.translate(centerX, centerY);
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2 + time * 1.5;
                const orbitR = baseRadius + 25;
                const dx = Math.cos(angle) * orbitR;
                const dy = Math.sin(angle) * orbitR;
                const dotSize = 3 + Math.sin(time * 3 + i) * 1;
                ctx.fillStyle = `rgba(255, 64, 129, ${0.4 + Math.sin(time * 2 + i) * 0.3})`;
                ctx.shadowColor = '#FF4081';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(dx, dy, dotSize, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawStatusText(time) {
            const centerX = WIDTH / 2;
            const statusY = HEIGHT * 0.78;
            const msgIndex = Math.floor(time / 1.2) % messages.length;
            const msgProgress = (time % 1.2) / 1.2;

            // Fade effect
            let alpha = 1;
            if (msgProgress < 0.1) alpha = msgProgress / 0.1;
            else if (msgProgress > 0.85) alpha = (1 - msgProgress) / 0.15;

            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '300 28px "Segoe UI", sans-serif';
            ctx.letterSpacing = '3px';
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#b8a0cc';
            ctx.shadowColor = '#E91E63';
            ctx.shadowBlur = 8;
            ctx.fillText(messages[msgIndex].toUpperCase(), centerX, statusY);

            // Dots animation
            const dots = '.'.repeat(Math.floor(time * 2) % 4);
            ctx.fillStyle = '#FF4081';
            ctx.fillText(dots, centerX + ctx.measureText(messages[msgIndex].toUpperCase()).width / 2 + 10, statusY);
            ctx.restore();

            // Progress percentage
            ctx.save();
            ctx.textAlign = 'center';
            ctx.font = '300 22px "Segoe UI", sans-serif';
            ctx.fillStyle = 'rgba(184, 160, 204, 0.5)';
            const progress = Math.floor((time / DURATION) * 100);
            ctx.fillText(`${Math.min(progress, 100)}%`, centerX, statusY + 45);
            ctx.restore();
        }

        function drawParticles(dt) {
            particles.forEach(p => {
                p.update(dt);
                p.draw(ctx, animTime);
            });
        }

        function drawScanlines() {
            ctx.save();
            ctx.globalAlpha = 0.03;
            ctx.fillStyle = '#000';
            for (let y = 0; y < HEIGHT; y += 4) {
                ctx.fillRect(0, y, WIDTH, 1);
            }
            ctx.restore();
        }

        function renderFrame(time) {
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            drawBackground();
            drawParticles(1 / 60);
            drawTitle(time);
            drawRingLoader(time);
            drawStatusText(time);
            drawScanlines();
        }

        // Main animation loop (preview)
        let isRecording = false;

        function animate(timestamp) {
            if (isRecording) return;

            if (!lastTimestamp) lastTimestamp = timestamp;
            const dt = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;
            animTime += dt;

            renderFrame(animTime);
            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        // Recording with WebCodecs + mp4-muxer
        async function recordVideo() {
            isRecording = true;
            downloadBtn.disabled = true;
            downloadBtn.classList.add('recording');
            downloadBtn.textContent = 'Merekam & Mengenkode Video (0%)...';
            progressBar.classList.add('active');

            try {
                const target = new ArrayBufferTarget();
                const muxer = new Muxer({
                    target,
                    video: {
                        codec: 'avc',
                        width: WIDTH,
                        height: HEIGHT
                    },
                    fastStart: 'in-memory',
                    firstTimestampBehavior: 'offset'
                });

                const encoder = new VideoEncoder({
                    output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
                    error: (e) => {
                        console.error('Encoder error:', e);
                        throw e;
                    }
                });

                encoder.configure({
                    codec: 'avc1.640034',
                    width: WIDTH,
                    height: HEIGHT,
                    bitrate: 10_000_000,
                    framerate: FPS,
                    latencyMode: 'quality'
                });

                // Render and encode each frame
                const frameDuration = 1_000_000 / FPS; // microseconds

                for (let i = 0; i < TOTAL_FRAMES; i++) {
                    // Render frame
                    const t = i / FPS;
                    animTime = t;
                    renderFrame(t);

                    // Create VideoFrame from canvas
                    const frame = new VideoFrame(canvas, {
                        timestamp: i * frameDuration
                    });

                    // Encode
                    const keyFrame = i % 60 === 0;
                    encoder.encode(frame, { keyFrame });
                    frame.close();

                    // Update progress
                    const progress = Math.round((i / TOTAL_FRAMES) * 100);
                    progressFill.style.width = `${progress}%`;
                    downloadBtn.textContent = `Merekam & Mengenkode Video (${progress}%)...`;

                    // Yield to main thread every few frames
                    if (i % 10 === 0) {
                        await new Promise(r => setTimeout(r, 0));
                    }
                }

                // Flush encoder
                await encoder.flush();
                encoder.close();

                // Finalize muxer
                muxer.finalize();

                // Get the buffer
                const buffer = target.buffer;
                const blob = new Blob([buffer], { type: 'video/mp4' });

                // Trigger download
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'romance-engine-loading.mp4';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                // Reset UI
                downloadBtn.textContent = '✓ Unduh Selesai! Klik untuk Ulang';
                downloadBtn.disabled = false;
                downloadBtn.classList.remove('recording');
                statusText.textContent = 'Video MP4 berhasil diunduh.';
                progressFill.style.width = '100%';

                setTimeout(() => {
                    progressBar.classList.remove('active');
                    progressFill.style.width = '0%';
                    downloadBtn.textContent = 'Download MP4 (No Audio)';
                    statusText.textContent = '';
                }, 3000);

            } catch (err) {
                console.error('Recording error:', err);
                downloadBtn.textContent = 'Gagal. Coba Lagi.';
                downloadBtn.disabled = false;
                downloadBtn.classList.remove('recording');
                statusText.textContent = `Error: ${err.message}`;
                progressBar.classList.remove('active');
            }

            isRecording = false;
            lastTimestamp = 0;
            requestAnimationFrame(animate);
        }

        downloadBtn.addEventListener('click', recordVideo);
    </script>
</body>
</html>
