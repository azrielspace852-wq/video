name: Render HTML to MP4

on:
  push:
    branches: [main]
    paths: ['video/**', 'tools/**', '.github/workflows/render.yml']
  pull_request:
    paths: ['video/**']
  workflow_dispatch:
    inputs:
      force_rerender:
        description: 'Paksa render ulang (abaikan cache frame)'
        type: boolean
        default: false
      frame_format:
        description: 'Format frame'
        type: choice
        options: [jpeg, png, webp]
        default: jpeg

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: Render
    runs-on: ubuntu-latest
    timeout-minutes: 350          # < 6h GHA hard limit

    env:
      FORCE_RERENDER: ${{ inputs.force_rerender && '1' || '0' }}
      FRAME_FORMAT:   ${{ inputs.frame_format || 'jpeg' }}
      FRAME_QUALITY:  '95'
      KEEP_FRAMES:    '0'
      # Berhenti rapi 10 menit sebelum timeout job
      SOFT_DEADLINE_MS: '20400000'   # 5j40m

    steps:
      - uses: actions/checkout@v4

      - name: Scan video/ folder
        id: check
        shell: bash
        run: |
          set -e
          if [ ! -d "video" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mapfile -t files < <(find video -maxdepth 1 -type f \( -name '*.html' -o -name '*.htm' \) | sort)
          count=${#files[@]}
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            printf 'FOUND: %s\n' "${files[@]}"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.found == 'true'
        with: { node-version: '20' }

      - name: Cache Puppeteer Chromium
        if: steps.check.outputs.found == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('tools/package.json') }}
          restore-keys: puppeteer-${{ runner.os }}-

      - name: Install ffmpeg
        if: steps.check.outputs.found == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install renderer deps
        if: steps.check.outputs.found == 'true'
        working-directory: tools
        run: npm install --no-audit --no-fund

      - name: Render
        if: steps.check.outputs.found == 'true'
        run: node tools/render.js

      - name: Package artifact
        if: always() && steps.check.outputs.found == 'true'
        id: package
        shell: bash
        run: |
          set -e
          mkdir -p artifact
          shopt -s nullglob
          files=(output/*.mp4)
          if [ ${#files[@]} -eq 0 ]; then
            echo "kind=none" >> "$GITHUB_OUTPUT"
            echo "::warning::Tidak ada MP4 dihasilkan (mungkin soft-deadline / semua gagal)."
            exit 0
          fi
          if [ ${#files[@]} -eq 1 ]; then
            cp "${files[0]}" artifact/
            echo "kind=single" >> "$GITHUB_OUTPUT"
          else
            (cd output && zip -q -r ../artifact/videos.zip ./*.mp4)
            echo "kind=zip" >> "$GITHUB_OUTPUT"
          fi
          ls -lh artifact/

      - name: Upload artifact
        if: always() && steps.check.outputs.found == 'true' && steps.package.outputs.kind != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          path: artifact/*
          if-no-files-found: warn
          retention-days: 30
